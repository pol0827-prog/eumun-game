/* --- 나이스 PDF 읽기: PDF.js로 글자와 위치를 뽑아 표를 다시 짭니다 --- */
async function pdfPages(file){
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();
    pages.push(tc.items.filter(it => it.str && it.str.trim()).map(it => ({ s: it.str.trim(), l: it.transform[4], x: it.transform[4] + (it.width || 0) / 2, y: it.transform[5] })));
  }
  return pages;
}
function parseMonthPdf(pages){
  const rows = []; const H = ['일자','번호','성명','출결구분','결시교시','사유'];
  pages.forEach(items => {
    const hdr = {}; H.forEach(hn => { const it = items.find(i => i.s.replace(/\s/g, '') === hn); if (it) hdr[hn] = it; });
    if (!hdr['일자'] || !hdr['결시교시']) return;
    const cols = Object.entries(hdr).map(([k, it]) => ({ k, x: it.x })).sort((a, b) => a.x - b.x);
    /* 칸 시작: 이웃한 머리글 가운데 사이에서 조금 왼쪽(왼쪽 정렬 글자도 제 칸에 들어가게) */
    cols.forEach((c, i) => { c.start = i ? (cols[i - 1].x + c.x) / 2 - (c.x - cols[i - 1].x) * 0.15 : -1e9; });
    const body = items.filter(i => i.y < hdr['일자'].y - 2);
    const anchors = body.filter(i => /^\d{4}\.\d{2}\.\d{2}/.test(i.s)).map(a => ({ y: a.y, cells: {} }));
    body.forEach(i => {
      let best = null, bd = 1e9; anchors.forEach(r => { const dd = Math.abs(r.y - i.y); if (dd < bd) { bd = dd; best = r; } });
      if (!best || bd > 40) return;
      const col = cols.filter(c => c.start <= i.l + 2).pop() || cols[0];
      (best.cells[col.k] ||= []).push(i);
    });
    anchors.forEach(r => {
      const cell = k => (r.cells[k] || []).sort((a, b) => b.y - a.y || a.l - b.l).map(i => i.s).join('');
      const dm = cell('일자').match(/(\d{4})\.(\d{2})\.(\d{2})/); if (!dm) return;
      rows.push({ d: `${dm[1]}-${dm[2]}-${dm[3]}`, num: parseInt(cell('번호'), 10) || 0, name: cell('성명'), gubun: cell('출결구분').replace(/\s/g, ''), periods: cell('결시교시'), reason: cell('사유') });
    });
  });
  return rows;
}
function parseClassPdf(pages){
  const rows = [];
  pages.forEach(items => {
    const lines = [];
    items.slice().sort((a, b) => b.y - a.y).forEach(i => { const ln = lines.find(L => Math.abs(L.y - i.y) < 2.5); if (ln) ln.items.push(i); else lines.push({ y: i.y, items: [i] }); });
    lines.forEach(L => {
      const t = L.items.sort((a, b) => a.l - b.l).flatMap(i => i.s.split(/\s+/)).filter(Boolean);
      if (!/^\d{1,2}$/.test(t[0] || '')) return;
      let j = 1; const nm = []; while (j < t.length && !/^\d+$/.test(t[j])) nm.push(t[j++]);
      const nums = t.slice(j).map(Number);
      if (!nm.length || nums.length < 17 || nums.some(isNaN)) return;
      const c = {}; KINDS.forEach((k, ki) => { c[k] = {}; STAT_R.forEach((r, ri) => { c[k][r] = nums[1 + ki * 3 + ri]; }); });
      rows.push({ num: Number(t[0]), name: nm.join(''), days: nums[0], c });
    });
  });
  return rows;
}
function periodSet(t){
  const s = String(t || '').replace(/([1-7])\s*[~\-]\s*([1-7])/g, (_, a, b) => { const out = []; for (let i = Number(a); i <= Number(b); i++) out.push(i); return out.join(','); });
  return [...new Set((s.match(/(?<!\d)[1-7](?!\d)/g) || []).map(Number))].sort((a, b) => a - b);
}
const setText = a => a.length ? a.join(',') + '교시' : '없음';
/* 월별 표의 결시교시: 결석은 '모든 교시 결석', 지각 'N교시까지'는 '조회~N교시', 조퇴 'N교시후'는 'N교시~종례', 결과는 적은 그대로 */
/* 교시 칸 글을 결시 범위로:
   지각 'N교시까지' → 조회~N교시, 'N교시에(부터·도착·등교)'·'마지막교시' → 조회~그 직전 교시
   조퇴 'N교시후'·'마지막교시' → N교시~종례. 마지막 교시는 그 요일의 종례 앞 교시(lastP). */
function absRange(r, d){
  const t = String((r && r.n) || '').trim(); if (!t || !r || (r.k !== '지각' && r.k !== '조퇴')) return null;
  const L = lastP(d); const last = /마지막/.test(t); const m = t.match(/([1-8])\s*교?시?/);
  const N = last ? L : (m ? Number(m[1]) : null);
  if (N == null || (!last && /[~\-]/.test(t))) return null;
  if (r.k === '지각') { const arrived = last || (/(에|부터|도착|등교|출석|와서|옴)/.test(t) && !/까지/.test(t)); return { s: 1, e: arrived ? N - 1 : N }; }
  return { s: N, e: L };
}
function absText(r, d){
  if (!r || r.k === '출석') return '';
  if (r.k === '결석') return '모든 교시 결석';
  const g = absRange(r, d);
  if (g && r.k === '지각') return g.e >= 1 ? `조회~${g.e}교시` : '조회';
  if (g && r.k === '조퇴') return `${g.s}교시~종례`;
  return String(r.n || '').trim();
}
/* 대조용 결시 교시(숫자만) */
function absSet(r, d){
  const g = absRange(r, d);
  if (g) { const out = []; for (let i = Math.max(1, g.s); i <= g.e; i++) out.push(i); return out; }
  return periodSet(String(r.n || ''));
}
const normG = s => String(s || '').replace(/\s/g, '').replace('출석인정', '인정');
const mdw = d => { const x = parseKey(d); return `${x.getMonth() + 1}/${x.getDate()}(${DAYS[x.getDay()]})`; };
/* 교시 묶음을 사람이 읽는 말로: 1부터 이어지면 '조회~N교시', 7까지 이어지면 'N교시~종례' */
function fmtSet(a, L = 7){
  if (!a.length) return '없음';
  const cont = a.every((v, i) => !i || v === a[i - 1] + 1);
  if (cont && a[0] === 1 && a[a.length - 1] < L) return `조회~${a[a.length - 1]}교시`;
  if (cont && a[a.length - 1] >= L && a[0] > 1) return `${a[0]}교시~종례`;
  if (cont && a.length > 1) return `${a[0]}~${a[a.length - 1]}교시`;
  return a.join(',') + '교시';
}
/* 대조 결과는 한 줄에 하나씩: 누구 · 나이스 · 앱 · 할 일(날짜와 무엇을 할지까지) */
function compareMonth(ym, neis){
  const app = monthRows(ym); const g = group(C().homeroomId); const items = []; let ok = 0;
  const key = x => `${x.d}|${x.num}`;
  const nBy = {}; neis.filter(x => x.d.startsWith(ym)).forEach(x => (nBy[key(x)] ||= []).push(x));
  const aBy = Object.fromEntries(app.map(x => [key(x), x]));
  const nameBad = new Set();
  neis.forEach(x => { const st = g.students.find(s => s.num === x.num); if (st && x.name && nz(st.name) !== nz(x.name) && !nameBad.has(x.num)) { nameBad.add(x.num); items.push({ when: '', who: `${x.num}번`, neis: x.name, app: st.name, kind: 'fix', todo: '번호·이름 다름' }); } });
  [...new Set([...Object.keys(nBy), ...Object.keys(aBy)])].sort().forEach(k => {
    const n = nBy[k] || [], a = aBy[k]; const any = n[0] || a; const day = mdw(any.d);
    const base = { when: day, who: `${any.num}번 ${any.name}` };
    if (n.length && !a) return items.push({ ...base, neis: n.map(x => x.gubun).join(', '), app: '없음', kind: 'app', todo: '앱 누락' });
    if (a && !n.length) return items.push({ ...base, neis: '없음', app: a.gubun, kind: 'neis', todo: '나이스 누락' });
    if (!n.some(x => normG(x.gubun) === normG(a.gubun))) return items.push({ ...base, neis: n.map(x => x.gubun).join(', '), app: a.gubun, kind: 'fix', todo: '구분 다름' });
    if (n.length > 1) items.push({ ...base, neis: n.map(x => x.gubun).join(', '), app: a.gubun, kind: 'warn', warn: true, todo: '앱은 하루 1건' });
    if (a.r.k !== '결석') {
      const L = lastP(a.d); const nn = periodSet(n.find(x => normG(x.gubun) === normG(a.gubun)).periods).filter(v => v <= L), aa = absSet(a.r, a.d);
      if (!aa.length && nn.length) return items.push({ ...base, neis: `${a.gubun} ${fmtSet(nn, L)}`, app: '교시 빈칸', kind: 'warn', warn: true, todo: '앱 교시 누락' });
      if (nn.length && nn.join() !== aa.join()) return items.push({ ...base, neis: `${a.gubun} ${fmtSet(nn, L)}`, app: `${a.gubun} ${fmtSet(aa, L)}`, kind: 'fix', todo: '교시 다름' });
    }
    ok++;
  });
  return { ok, items };
}
function compareClass(ym, neis, days){
  const app = classCounts(ym); const rowsM = monthRows(ym); const items = []; let ok = 0;
  if (days && days !== statDays(ym)) {
    const diff = statDays(ym) - days;
    items.push({ who: '수업일수', what: '', neis: `${days}일`, app: `${statDays(ym)}일`, kind: 'fix', warn: true,
      todo: diff > 0 ? `휴업일 ${diff}일 미등록` : `휴업일 ${-diff}일 초과 등록` });
  }
  neis.forEach(x => {
    const a = app.find(s => s.num === x.num); const who = `${x.num}번 ${x.name}`;
    if (!a) return items.push({ who, what: '명렬표', neis: '있음', app: '없음', kind: 'fix', todo: '앱 명렬표 누락' });
    if (nz(a.name) !== nz(x.name)) items.push({ who: `${x.num}번`, what: '이름', neis: x.name, app: a.name, kind: 'fix', todo: '번호·이름 다름' });
    let same = true;
    KINDS.forEach(k => STAT_R.forEach(r => {
      const nv = x.c[k][r], av = a.c[k][r]; if (nv === av) return; same = false;
      const days2 = rowsM.filter(m => m.no === a.no && m.r.k === k && m.r.r === r).map(m => mdw(m.d));
      items.push({ who, what: `${r}${k}`, neis: nv, app: days2.length ? `${av} (${days2.join(', ')})` : av, kind: nv > av ? 'app' : 'neis',
        todo: nv > av ? `${nv - av}일 기록 앱은 누락` : `${av - nv}일 기록 나이스는 누락` });
    }));

function parseClassSheet(rows){

    const t = r.map(c => c.trim()).filter(Boolean);
    if (!/^\d{1,2}$/.test(t[0] || '')) return;
    let j = 1; const nm = []; while (j < t.length && !/^\d+$/.test(t[j])) nm.push(t[j++]);

    if (!nm.length || nums.length < 17 || nums.some(isNaN)) return;
    const c = {}; KINDS.forEach((k, ki) => { c[k] = {}; STAT_R.forEach((r2, ri) => { c[k][r2] = nums[1 + ki * 3 + ri]; }); });

/* ---------- 반별 수업 역할: 국어부장1·2, 수업리뷰(여러 명이면 이름 순서대로 수업마다 돌아감) ----------
   g.roles = { lead1, lead2, review:[학번…(이름순)], offset }.
   차례 = (그 반 수업 중 ‘체크 완료’한 앞선 시간 수 + offset) % 인원 */
const byName = (a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ko');
function doneLessonsBefore(gid, d, p){
  let n = 0;
  Object.keys(S.att).forEach(dd => {
    if (dd > d) return;
    Object.entries(S.att[dd].done || {}).forEach(([k, v]) => {
      if (!v || k === 'hr') return; const [pp, cid] = splitKey(k); const c = course(cid);
      if (!c || c.groupId !== gid || isJrCourse(c)) return;
      if (dd < d || pp < p) n++;
    });
  });
  return n;
}
function reviewerFor(g, d, p){
  const r = g.roles || {}; const list = (r.review || []).filter(no => g.students.some(s => s.no === no) && isActive(no));
  if (!list.length) return null;
  const i = ((doneLessonsBefore(g.id, d, p) + (r.offset || 0)) % list.length + list.length) % list.length;
  return list[i];
}
const roleName = (g, no) => { const s = no && g.students.find(x => x.no === no); return s ? s.name : ''; };
/* 안내판·출결 화면에 붙이는 한 줄: 국어부장1 ○○ · 국어부장2 ○○ · 수업리뷰 ○○ */
function roleLine(key, d){
  if (!key || key === 'hr') return '';
  const [p, cid] = splitKey(key); const c = course(cid); const g = c && group(c.groupId); if (!g || !g.roles) return '';
  const r = g.roles; const parts = [];
  if (roleName(g, r.lead1)) parts.push(`국어부장1 ${roleName(g, r.lead1)}`);
  if (roleName(g, r.lead2)) parts.push(`국어부장2 ${roleName(g, r.lead2)}`);
  const rv = reviewerFor(g, d, p); if (rv) parts.push(`수업리뷰 ${roleName(g, rv)}`);
  return parts.join(' · ');
}
function roleEditorHTML(g){
  const r = g.roles || {}; const list = studentsOf(g).filter(s => isActive(s.no)).sort(byName);
  const opt = sel => `<option value="">없음</option>` + list.map(s => `<option value="${esc(s.no)}" ${sel === s.no ? 'selected' : ''}>${esc(s.name)}${s.num ? ' (' + s.num + '번)' : ''}</option>`).join('');
  const now = reviewerFor(g, '9999-12-31', 1);
  return `<div class="seg-label" style="margin-top:6px">수업 역할</div>
  <div class="row" style="flex-wrap:nowrap;gap:8px"><label class="f" style="flex:1">국어부장1<select id="rL1">${opt(r.lead1)}</select></label><label class="f" style="flex:1">국어부장2<select id="rL2">${opt(r.lead2)}</select></label></div>
  <div class="small" style="font-weight:600;margin-bottom:6px">수업리뷰 <span class="muted" style="font-weight:400">여러 명이면 이름 순서대로 수업(체크 완료)마다 돌아갑니다</span></div>
  <div class="chips" id="rRev" style="margin-bottom:10px">${list.map(s => `<button class="chip" data-act="revT" data-no="${esc(s.no)}" aria-pressed="${(r.review || []).includes(s.no)}">${esc(s.name)}</button>`).join('')}</div>
  <label class="f">다음 수업리뷰 차례<select id="rNext"><option value="">그대로 (지금: ${esc(roleName(g, now) || '없음')})</option>${list.map(s => `<option value="${esc(s.no)}">${esc(s.name)}</option>`).join('')}</select></label>`;
}
function readRoleEditor(g){
  if (!$('#rL1')) return;
  const valid = new Set(g.students.map(s => s.no));
  const review = [...document.querySelectorAll('#rRev [aria-pressed="true"]')].map(b => b.dataset.no).filter(no => valid.has(no));
  review.sort((a, b) => byName({ name: roleName(g, a) }, { name: roleName(g, b) }));
  const r = { lead1: valid.has($('#rL1').value) ? $('#rL1').value : '', lead2: valid.has($('#rL2').value) ? $('#rL2').value : '', review, offset: (g.roles && g.roles.offset) || 0 };
  const nx = $('#rNext').value; const idx = review.indexOf(nx);
  if (nx && idx >= 0) { const n = review.length; r.offset = ((idx - doneLessonsBefore(g.id, '9999-12-31', 1)) % n + n) % n; }
  if (!r.lead1 && !r.lead2 && !review.length) delete g.roles; else g.roles = r;
}

function parseHome(t){
  let m = String(t).match(/^(\d)\s*[-–.]\s*(\d{1,2})(반)?$/) || String(t).match(/^(\d)학년\s*(\d{1,2})반?$/);
  if (m) return { g: m[1], c: Number(m[2]), text: `${m[1]}-${Number(m[2])}` };
  m = String(t).match(/^(\d{1,2})반$/);
  if (m) return { g: '', c: Number(m[1]), text: `${Number(m[1])}` };
  return null;
}
function parseRoster(txt, prev){
  const seen = new Set(); const used = new Set(); const out = [];
  const isNum = t => /^\d{1,2}(번|\.)?$/.test(t);
  txt.split(/\n/).map(l => l.trim()).filter(Boolean).forEach(l => {
    let tk = l.split(/[\s,\t;]+/).filter(Boolean);
    if (tk.includes('위탁학생')) tk = tk.map(t => t === '위탁학생' ? '위탁' : t);
    const st = ['결번', ...ST_OFF].find(s => tk.includes(s)) || '';
    const tg = ST_TAGS.filter(t => tk.includes(t));
    tk = tk.filter(t => !ST_OFF.includes(t) && !ST_TAGS.includes(t) && t !== '재학');
    if (tk.length > 1 && /^\d학년$/.test(tk[0]) && /^\d{1,2}반$/.test(tk[1])) tk = [tk[0] + tk[1], ...tk.slice(2)];
    let no = '', num = 0, home = '', homeNum = 0, name = '';
    const h0 = tk.length >= 3 ? parseHome(tk[0]) : null;
    const plainClass = !h0 && tk.length >= 3 && isNum(tk[0]) && isNum(tk[1]) && (tk.length >= 4 || !isNum(tk[2]) || st === '결번');
    if ((h0 || plainClass) && isNum(tk[1])) {
      const hp = h0 || { g:'', c: parseInt(tk[0], 10), text: String(parseInt(tk[0], 10)) };
      home = hp.text; homeNum = parseInt(tk[1], 10);
      let rest = tk.slice(2);
      if (rest.length && isNum(rest[0]) && (rest.length > 1 || st === '결번')) { num = parseInt(rest[0], 10); rest = rest.slice(1); } else num = homeNum;
      name = rest.join(' ');
      no = hp.g ? `${hp.g}${String(hp.c).padStart(2, '0')}${String(homeNum).padStart(2, '0')}` : `r${hp.c}-${homeNum}`;
    } else {
      no = tk.find(t => /^\d{3,6}$/.test(t)) || '';
      const nt = tk.find(t => isNum(t)); num = nt ? parseInt(nt, 10) : 0;
      name = tk.filter(t => !/^\d+(번|\.)?$/.test(t)).join(' ');
    }
    if (!name && !(st === '결번' && (no || num))) return;
    if (!no) {
      const old = (prev || []).find(x => !realNo(x.no) && !used.has(x.no) && (x.name || '') === name && (!num || !x.num || x.num === num));
      no = old ? old.no : 'x' + rid();
    }
    if (seen.has(no)) return; seen.add(no); used.add(no);
    const o = { no, name, st, tg }; if (num) o.num = num; if (home) { o.home = home; o.homeNum = homeNum; }
    out.push(o);
  });
  return out;
}

const csvCell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };

function saveFile(filename, text){
  try {
    const type = filename.endsWith('.json') ? 'application/json' : 'text/csv;charset=utf-8';
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(`${filename} 내려받기를 시작했습니다.`);
  } catch (e) {
    openSheet(`<h3>${esc(filename)}</h3><p class="small muted">아래 내용을 전체 선택해 복사하세요.</p><textarea style="min-height:260px" readonly>${esc(text.replace(/^\ufeff/, ''))}</textarea><div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn" data-act="closeSheet">닫기</button></div>`);

}

  stSet: el => { const no = el.dataset.no, v = el.dataset.v; if (v) C().status[no] = v; else delete C().status[no]; saveConfig(); statusSheet(el.dataset.g); },
  stClose: () => { closeSheet(); render(); },
  editCourse: el => editCourseSheet(el.dataset.id),
  editSlot: el => editSlotSheet(Number(el.dataset.d), Number(el.dataset.p)),
  backup: () => backup(),
  sample: () => { if (C().groups.length) askConfirm('기존 설정에 예시 반·과목·시간표를 추가할까요?', '추가', loadSample); else loadSample(); },
  reset: () => ui.role !== 'owner' ? toast('주인 계정만 모두 삭제할 수 있습니다.') : askConfirm('모든 명렬표·시간표·출결·관찰 기록을 삭제할까요? 되돌릴 수 없습니다.', '모두 삭제', async () => { await wipe(); saveConfig(); ui.tab = 'home'; render(); toast('모든 기록을 삭제했습니다.'); })
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-sec]') && d.open) ui.openSec = d.dataset.sec; }, true);
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'pnote' && ui.pick) { if (commitPick()) render(); return; }
  const ch = el.dataset.change; if (!ch) return; const st = S.config && C().settings;
  if (ch === 'ovsel') { el.classList.toggle('changed', el.value !== el.dataset.base); }
  else if (ch === 'setdate') { if (el.value) { ui.date = el.value; render(); } }
  else if (ch === 'set') { st[el.dataset.f] = el.value.trim(); saveConfig(); toast('저장했습니다.'); }
  else if (ch === 'setNum') { st[el.dataset.f] = Math.max(1, Math.round(Number(el.value)) || 1); saveConfig(); toast('저장했습니다.'); }
  else if (ch === 'setBool') { st[el.dataset.f] = el.checked; saveConfig(); }
  else if (ch === 'restore') { if (el.files[0]) restore(el.files[0]); el.value = ''; }
  else if (ch === 'statDays') { C().settings.statDays ||= {}; C().settings.statDays[ui.statYM || curYM()] = Math.max(1, Math.min(31, parseInt(el.value, 10) || 1)); saveConfig(); render(); }
  else if (ch === 'pfSince') { if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) { const pf = pfOf(); pf.since = el.value; C().settings.perfect = pf; saveConfig(); ui.openSec = 'pf'; render(); } }
  else if (ch === 'sgFile') { const f = el.files[0]; el.value = ''; if (f) sgLoad(f); }
  else if (ch === 'sgDone') { const s = C().settings; s.sgDone ||= {}; s.sgDone[el.dataset.no] = Math.max(0, parseInt(el.value, 10) || 0); saveConfig(); render(); }
  else if (ch === 'sgSet') { C().settings[el.dataset.f] = Math.max(1, parseInt(el.value, 10) || 1); saveConfig(); render(); }
  else if (ch === 'statPdf') { const fs = [...el.files]; el.value = ''; if (fs.length) statCheckFiles(fs); }
  else if (ch === 'ttUpload') { const fs = [...el.files]; el.value = ''; if (fs.length) ttUpload(fs); }
  else if (ch === 'stuOne') {
    const f = el.files[0]; const no = el.dataset.no; el.value = '';
    if (f && !stuFileOk(f)) toast(`${f.name}: PDF, 사진(PNG·JPG), 엑셀 파일만 올릴 수 있습니다.`);
    else if (f) stuPut(f, no).then(ok => { if (ok) { ui.stuTT = no; render(); toast('올렸습니다.'); } });
  }
  else if (ch === 'failDone') {
    const f = failOf(el.dataset.no).find(x => x.id === el.dataset.id); if (!f) return;
    f.done = el.checked; saveConfig(); render(); if (sheetOpen()) missSheet(el.dataset.no);
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.input !== 'obsq') return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#obsList .stu-li').forEach(b => b.style.display = !q || b.dataset.q.toLowerCase().includes(q) ? '' : 'none');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen()) ACT.closeSheet(); });
/* 화면을 끄거나 다른 앱으로 넘어갈 때, 저장을 기다리던 기록을 곧바로 보냅니다 */
document.addEventListener('visibilitychange', () => { if (document.hidden) Store.flushAll(); });
window.addEventListener('pagehide', () => Store.flushAll());

/* ---------- boot / Google 로그인 ---------- */
function showMessage(html){ $('#tabs').innerHTML = ''; $('#logoutBtn').hidden = true; $('#view').innerHTML = `<div class="intro">${html}</div>`; }
function showWelcome(msg){
  showMessage(`<h2>EduCheck</h2><p>고교학점제 출결·관찰 누가기록</p>
  <button class="btn primary block" data-act="login" style="margin-top:12px">Google 계정으로 로그인</button>
  <p class="small muted" style="margin-top:8px">휴대폰·노트북·태블릿에서 같은 Google 계정으로 로그인하면 기록이 자동으로 이어집니다.</p>
  ${msg ? `<div class="alert" role="alert" style="margin-top:12px;cursor:default">${esc(msg)}</div>` : ''}`);
}
const LEGACY_DONE = 'educheck:legacyDone';
const legacyDone = () => { try { return localStorage.getItem(LEGACY_DONE) === '1'; } catch (e) { return false; } };
const setLegacyDone = () => { try { localStorage.setItem(LEGACY_DONE, '1'); } catch (e) {} };
function showLegacyOffer(code){
  showMessage(`<h2>기존 기록을 옮길까요?</h2>
  <p>이 기기에 예전 접속 코드로 저장된 기록이 있습니다. 지금 로그인한 Google 계정으로 옮기면 모든 기기에서 같은 기록을 볼 수 있습니다.</p>
  <button class="btn primary block" data-act="legacyImport" data-c="${esc(code)}">기존 기록을 이 계정으로 옮기기</button>
  <button class="btn block" style="margin-top:8px" data-act="legacySkip">옮기지 않고 새로 시작</button>`);
}
async function importLegacy(code){
  const snap = await Store.colOf(code).get();
  if (snap.empty) return 0;
  let batch = Store.fs.batch(), n = 0, total = 0;
  for (const d of snap.docs) {
    batch.set(Store.col().doc(d.id), d.data()); n++; total++;
    if (n === 400) { await batch.commit(); batch = Store.fs.batch(); n = 0; }
  }
  if (n) await batch.commit();
  return total;
}
async function connect(uid){
  Store.stop(); Store.code = uid; ttResetCache(); ui.accList = undefined;
  S.config = null; S.att = {}; S.obs = {}; closeSheet();
  $('#view').innerHTML = '<div class="loading">기록을 불러오는 중…</div>';
  try {
    const docs = await Store.loadAll();
    if (!docs.config && !legacyDone() && validCode(getCode())) { showLegacyOffer(getCode()); return true; }
    S.config = normalizeConfig(docs.config);
    Object.entries(docs).forEach(([id, d]) => {
      if (id.startsWith('att-')) { d.rec ||= {}; d.done ||= {}; d.neis ||= {}; S.att[id.slice(4)] = d; }
      else if (id.startsWith('obs-') && d && d.no) S.obs[d.no] = { ...d, entries: d.entries || [] };
    });
    ui.tab = 'home'; ui.date = todayKey();
    render(); Store.listen();
    return true;
  } catch (e) {
    console.error(e);
    showMessage(`<h2>기록을 불러오지 못했습니다</h2><p class="small muted">${esc(e && e.code === 'permission-denied' ? 'Firestore 보안 규칙을 확인하세요. 로그인한 계정의 기록만 읽도록 규칙이 설정되어 있어야 합니다.' : '인터넷 연결을 확인한 뒤 새로고침하세요.')}</p><button class="btn" data-act="logout">로그아웃</button>`);
    return false;
  }
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast('복사했습니다.'); }
  catch (e) { openSheet(`<h3>아래를 길게 눌러 복사하세요</h3><textarea readonly style="min-height:90px">${esc(t)}</textarea><div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn" data-act="closeSheet">닫기</button></div>`); }
}
const AUTH_MSG = {
  'auth/unauthorized-domain': 'Firebase 콘솔 → Authentication → 설정 → 승인된 도메인에 이 사이트 주소를 추가하세요.',
  'auth/operation-not-allowed': 'Firebase 콘솔 → Authentication → 로그인 방법에서 Google을 사용 설정하세요.',
  'auth/network-request-failed': '인터넷 연결을 확인한 뒤 다시 시도하세요.'
};
Object.assign(ACT, {
  login: async () => {
    const provider = new firebase.auth.GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
    try { await firebase.auth().signInWithPopup(provider); }
    catch (e) {
      if (e && ['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) {
        try { await firebase.auth().signInWithRedirect(provider); return; } catch (e2) { e = e2; }
      }
      if (e && ['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(e.code)) return;
      showWelcome((e && AUTH_MSG[e.code]) || `로그인하지 못했습니다. (${(e && e.code) || '알 수 없는 오류'})`);
    }
  },
  logout: () => askConfirm('로그아웃할까요? 기록은 지워지지 않고, 다시 로그인하면 그대로 열립니다. (저장되지 않은 오프라인 입력이 있으면 인터넷에 연결된 뒤 로그아웃하세요.)', '로그아웃', async () => {
    Store.stop();
    try { await firebase.auth().signOut(); await Store.fs.terminate(); await Store.fs.clearPersistence(); } catch (e) {}
    location.reload();
  }),
  legacyImport: async el => {
    $('#view').innerHTML = '<div class="loading">기록을 옮기는 중…</div>';
    try { const n = await importLegacy(el.dataset.c); setLegacyDone(); await connect(Store.code); toast(n ? `기록 ${n}건을 옮겼습니다.` : '옮길 기록이 없었습니다.'); }
    catch (e) { console.error(e); showLegacyOffer(el.dataset.c); toast('기존 기록을 읽지 못했습니다. Firestore 보안 규칙(옮기기용 읽기 허용)을 확인하세요.'); }
  },
  legacySkip: () => { setLegacyDone(); connect(Store.code); },
  legacyManual: () => {
    const c = normCode($('#legacyIn').value);
    if (!validCode(c)) { toast('코드는 영문·숫자 24자리입니다. 다시 확인하세요.'); return; }
    askConfirm('이 접속 코드의 기록을 현재 계정으로 복사할까요? 같은 날짜·설정은 덮어씁니다.', '가져오기', async () => {
      try { const n = await importLegacy(c); if (!n) { toast('이 코드에는 기록이 없습니다. 코드를 확인하세요.'); return; } setLegacyDone(); await connect(Store.code); toast(`기록 ${n}건을 가져왔습니다.`); }
      catch (e) { console.error(e); toast('가져오지 못했습니다. 코드와 Firestore 보안 규칙을 확인하세요.'); }
    });
  }
});
tick(); setInterval(tick, 1000);
(async () => {
  if (typeof firebase === 'undefined' || !firebase.auth) { showMessage('<h2>연결할 수 없습니다</h2><p>인터넷 연결을 확인한 뒤 새로고침하세요.</p>'); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  Store.fs = firebase.firestore();
  try { await Store.fs.enablePersistence({ synchronizeTabs: true }); } catch (e) {}
  showMessage('<p class="muted" style="margin:0">로그인 확인 중…</p>');
  firebase.auth().getRedirectResult().catch(e => showWelcome((e && AUTH_MSG[e.code]) || `로그인하지 못했습니다. (${(e && e.code) || ''})`));
  const reject = msg => {
    /* 들어올 수 없는 계정은 바로 내보냅니다(실제 차단은 Firestore 보안 규칙이 합니다) */
    Store.stop(); Store.code = ''; S.config = null; S.att = {}; S.obs = {}; ui.role = null; closeSheet();
    ui.loginMsg = msg; /* 로그아웃 뒤 첫 화면이 다시 그려져도 이 안내가 남게 함 */
    showWelcome(msg);
    firebase.auth().signOut().catch(() => {});
  };
  firebase.auth().onAuthStateChanged(async user => {
    if (!user) { Store.stop(); Store.code = ''; S.config = null; S.att = {}; S.obs = {}; ui.role = null; closeSheet(); showWelcome(ui.loginMsg); ui.loginMsg = ''; return; }
    if (isOwnerUser(user)) { ui.role = 'owner'; ui.ownerUid = user.uid; connect(user.uid); return; }
    const NOT_ALLOWED = `${user.email}은(는) 등록되지 않은 계정입니다. 지정 계정으로 로그인하세요.`;
    if (!user.emailVerified) return reject(NOT_ALLOWED);
    showMessage('<p class="muted" style="margin:0">등록된 계정인지 확인 중…</p>');
    try {
      const a = await accessCol().doc(emailOf(user)).get({ source: 'server' });
      if (!a.exists || !a.data().owner) return reject(NOT_ALLOWED);
      ui.role = a.data().role === 'edit' ? 'edit' : 'view'; ui.ownerUid = a.data().owner;
      connect(a.data().owner);
    } catch (e) {
      console.error(e);
      reject(e && e.code === 'permission-denied' ? NOT_ALLOWED : '등록 여부를 확인하지 못했습니다. 인터넷 연결을 확인하세요.');
    }
  });
})();
</script>
