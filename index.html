<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduCheck 출결·관찰기록</title>
<meta name="theme-color" content="#1F3557">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EduCheck">
<meta name="referrer" content="no-referrer">
<script>try { const t = localStorage.getItem('educheck:theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; if (localStorage.getItem('educheck:design') === 'illust') document.documentElement.dataset.design = 'illust'; } catch (e) {}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F8; --card:#FFFFFF; --ink:#141C24; --muted:#4A5562; --line:#D5DBE1;
  --cover:#1F3557; --cover-ink:#FFFFFF; --cover-soft:#B9C7DA;
  --red:#B42318; --blue:#1D5FA8; --green:#1F7A45; --amber:#8A6100; --gray:#565E69;
  --orange:#C2410C; --orange-bg:#FDEBDD; --red-bg:#FCE8E6; --blue-bg:#E4EEF9; --green-bg:#E3F3E9; --amber-bg:#FBF0D2; --gray-bg:#ECEEF1; --sel:#E4EBF5;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F141A; --card:#19212A; --ink:#F1F4F7; --muted:#B0BAC5; --line:#323D49;
    --cover:#16273F; --cover-ink:#FFFFFF; --cover-soft:#9FB2CC;
    --red:#FF8A7E; --blue:#82B6F0; --green:#6FD196; --amber:#F0C25A; --gray:#B9C0C8;
    --orange:#FB923C; --orange-bg:#3D2414; --red-bg:#3E1D1A; --blue-bg:#18304D; --green-bg:#173322; --amber-bg:#3A2F12; --gray-bg:#262E37; --sel:#22324A;
  }
}
:root[data-theme="dark"]{
  --paper:#0F141A; --card:#19212A; --ink:#F1F4F7; --muted:#B0BAC5; --line:#323D49;
  --cover:#16273F; --cover-ink:#FFFFFF; --cover-soft:#9FB2CC;
  --red:#FF8A7E; --blue:#82B6F0; --green:#6FD196; --amber:#F0C25A; --gray:#B9C0C8;
  --orange:#FB923C; --orange-bg:#3D2414; --red-bg:#3E1D1A; --blue-bg:#18304D; --green-bg:#173322; --amber-bg:#3A2F12; --gray-bg:#262E37; --sel:#22324A;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--cover);color:var(--cover-ink)}
header.top > .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:8px;padding-bottom:8px}
.today{font-size:1.05rem;font-weight:600}
.clock{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:700;letter-spacing:.01em}

main{padding:18px 0 110px}
h2{font-size:1.35rem;margin:4px 0 14px;font-weight:700}
h3{font-size:1.05rem;margin:22px 0 10px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.92rem}

/* 메뉴 탭은 화면 맨 위(날짜·시계 바로 아래)에 붙어 있습니다. 화면 오른쪽 아래의 넷리파이 표시에 가리지 않게 하려는 것입니다. */
nav.tabs{background:var(--card);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(7,1fr);padding:0}
nav.tabs button{background:none;border:0;padding:10px 0 9px;font-size:.8rem;letter-spacing:-.04em;white-space:nowrap;color:var(--muted);position:relative;border-bottom:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--cover)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{border-bottom-color:var(--cover-soft)}}
.dot{position:absolute;top:5px;right:calc(50% - 30px);min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:.72rem;line-height:20px;padding:0 5px;font-weight:700}

.btn{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-weight:600;min-height:48px}
.btn.primary{background:var(--cover);border-color:var(--cover);color:var(--cover-ink)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.block{display:block;width:100%}
.btn.sm{padding:8px 12px;min-height:40px;font-size:.92rem}
.link{background:none;border:0;color:var(--blue);padding:4px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-size:1rem}
textarea{min-height:110px;resize:vertical}
label.f{display:block;margin-bottom:14px;font-weight:600}
label.f > input,label.f > select,label.f > textarea{margin-top:6px;font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--cover);border-color:var(--cover);color:var(--cover-ink);font-weight:600}
.empty{text-align:center;padding:32px 12px;color:var(--muted)}
.scroll-x{overflow-x:auto}

/* date */
.datebar{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;margin-bottom:8px}
.datebar > button{height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:1.5rem;line-height:1}
.dpick{position:relative;height:52px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem}
.dpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0}
.datenote{display:flex;justify-content:space-between;align-items:center;min-height:32px;margin-bottom:6px}

.alert{display:block;width:100%;text-align:left;border:2px solid var(--red);background:var(--red-bg);color:var(--ink);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-weight:700;font-size:1.02rem}
.alert span.pl{color:var(--ink);font-weight:700;font-size:.98rem;margin-top:4px}
.alert.info{border-color:var(--blue);background:var(--blue-bg)}
.alert.lunch{border-color:var(--green);background:var(--green-bg);cursor:default}
.alert.warn{border-color:var(--amber);background:var(--amber-bg)}
.alert span{display:block;font-weight:400;font-size:.92rem;color:var(--muted);margin-top:2px}

/* timetable list (home) */
.tt-list{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.per{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;min-height:72px}
.per:last-child{border-bottom:0}
.per .p{font-size:1.15rem;font-weight:700}
.per .s{font-size:1.12rem;font-weight:700;line-height:1.35}
.per .s small{display:block;font-size:.92rem;font-weight:400;color:var(--muted)}
.per.off .p,.per.off .s{color:var(--muted);font-weight:400}
.per.hr{background:var(--sel)}
.st{font-size:.88rem;font-weight:700;border-radius:8px;padding:5px 10px;white-space:nowrap}
.st.todo{background:var(--gray-bg);color:var(--gray)}
.st.ok{background:var(--green-bg);color:var(--green)}
.chg{font-size:.78rem;font-weight:700;color:var(--amber);background:var(--amber-bg);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.tt-head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.tt-head h3{margin:0}

/* week grid */
table.week{border-collapse:separate;border-spacing:4px;width:100%;min-width:330px;table-layout:fixed;margin:0 -4px}
table.week th{font-weight:700;font-size:1rem;padding:4px 0;text-align:center}
table.week thead th small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
table.week tbody th{width:34px;font-size:1rem;color:var(--muted)}
table.week thead th:first-child{width:34px}
table.week td{padding:0}
table.week th.tcol{background:var(--cover);color:var(--cover-ink);border-radius:10px}
table.week th.tcol small{color:var(--cover-soft)}
.wcw{position:relative}
.wc .wfl{font-style:normal;font-size:.64rem;font-weight:700;color:var(--orange);line-height:1.2;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.dmk{position:absolute;left:3px;bottom:3px;z-index:1;border:0;background:var(--red);color:#fff;font-size:.62rem;font-weight:700;line-height:1.15;border-radius:6px;padding:2px 4px;text-align:left;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dmk{color:#111}}
:root[data-theme="dark"] .dmk{color:#111}
@media (max-width:480px){.wc .mk{top:2px;left:3px;bottom:auto;right:auto}}
.wc{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:10px!important;width:100%;height:80px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:2px;line-height:1.2}
.wc b{font-size:1rem}
.wc span{font-size:.82rem;color:var(--muted)}
.wc.empty{background:transparent;border-style:dashed;border-color:transparent;font-size:.8rem;color:var(--muted)}
.wc.ok{background:var(--green-bg);border-color:var(--green)}
.wc.ok b{color:var(--green)}
.chgd{border:2px solid var(--amber)!important;background:var(--amber-bg)}
.wc.empty.chgd{border-style:dashed!important}
.wc.empty.jr{border:1.5px dashed var(--line);color:var(--muted);font-size:.85rem;justify-content:center;padding-top:2px!important}
table.tt td button.jr{color:var(--muted);font-weight:700;background:var(--gray-bg)}
td.tcol .wc:not(.empty):not(.ok){border-color:var(--cover);border-width:2px}
.ck{position:absolute;top:2px;right:5px;font-style:normal;font-weight:700;color:var(--green);font-size:.85rem}
.mk{position:absolute;bottom:2px;right:2px;font-style:normal;font-weight:700;font-size:.78rem;color:#fff;background:var(--red);border-radius:9px;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center;white-space:nowrap}
.hrrow .wc{height:72px;background:var(--sel)}
.hrrow .wc.ok{background:var(--green-bg)}
/* roster */
.rhead{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;margin-bottom:12px}
/* 인쇄: 화면에서는 숨기고, 인쇄할 때는 이것만 나옵니다 */
#printRoot{display:none}
/* 월간 통계 표 (화면·인쇄 같은 모양) */
.statwrap{background:#fff;color:#000;border:1.5px solid var(--line);border-radius:12px;padding:14px 12px}
.sdoc{min-width:560px;color:#000}
.sdate{text-align:right;font-size:.8rem}
.stitle{text-align:center;font-size:1.45rem;font-weight:700;letter-spacing:.12em;margin:6px 0 16px}
.shead{display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:4px}
.stab{border-collapse:collapse;width:100%;font-size:.82rem;background:#fff}
.stab th,.stab td{border:1px solid #000;padding:5px 3px;text-align:center;vertical-align:middle;font-weight:400}
.stab td.l{text-align:left;padding-left:5px}
.stab.cls th,.stab.cls td{padding:4px 2px;font-size:.78rem;line-height:1.15}
.stab.cls tbody tr:nth-child(5n) td{border-bottom:2.5px solid #000}
.ckres h4{margin:14px 0 6px;font-size:.98rem}
.cklist{list-style:none;padding:0;margin:0}
.cklist li{border-left:5px solid var(--red);background:var(--red-bg);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:.92rem}
.cklist li.warn{border-left-color:var(--amber);background:var(--amber-bg)}
.cklist li span{color:var(--muted);font-size:.86rem}
.ckok{color:var(--green);font-weight:700}
.ckstop{background:var(--amber-bg);border-left:5px solid var(--amber);border-radius:8px;padding:10px 12px;font-size:.95rem;margin:0 0 8px}
.cksum{font-size:.95rem;margin:4px 0 6px}
.cktab{border-collapse:collapse;width:100%;font-size:.86rem;min-width:420px}
.cktab th,.cktab td{border:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:top}
.cktab th{background:var(--paper);font-weight:700}
.cktab td.todo{font-weight:700;color:var(--red);white-space:nowrap}
.cktab tr.warn td.todo{color:var(--amber)}
.stuallh{font-weight:700;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}.stuallh:first-child{margin-top:0;padding-top:0;border-top:0}
.ttxl{overflow-x:auto;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:#111}.ttxl table{border-collapse:collapse;font-size:.78rem;min-width:100%}.ttxl td,.ttxl th{border:1px solid #cfd6dd;padding:4px 6px;white-space:nowrap;text-align:center}.ttxl .xlname{font-weight:700;padding:6px 8px;font-size:.8rem}
.ttview canvas,.ttview img{display:block;width:100%;height:auto;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.stumap{display:grid;grid-template-columns:1fr minmax(0,1fr);gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.stumap span{font-size:.9rem;word-break:break-all}
.stumap select{padding:8px 10px}
.stumap select.changed{border-color:var(--amber);background:var(--amber-bg)}
@media print{
  @page{margin:12mm}
  body{background:#fff!important;color:#000}
  header.top,main,#sheetRoot,.toast{display:none!important}
  #printRoot{display:block;color:#000;font-size:10.5pt;line-height:1.45}
  #printRoot h1{font-size:15pt;margin:0 0 2px}
  #printRoot h1 small{font-size:11pt;font-weight:400;margin-left:6px}
  #printRoot h2{font-size:12pt;margin:14px 0 6px}
  #printRoot p{margin:0 0 4px}
  #printRoot table{width:100%;border-collapse:collapse;margin-top:6px}
  #printRoot th,#printRoot td{border:1px solid #777;padding:3px 5px;text-align:left;vertical-align:top}
  #printRoot th{background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printRoot tr{break-inside:avoid}
  #printRoot tr.pm td{font-weight:700}
  #printRoot tr.off td{color:#555}
  #printRoot .sdoc{min-width:0}
  #printRoot .stab th,#printRoot .stab td{border:1px solid #000;text-align:center;background:none;padding:4px 3px}
  #printRoot .stab td.l{text-align:left}
  #printRoot .stab.cls tbody tr:nth-child(5n) td{border-bottom:2.5px solid #000}
  #printRoot .stitle{font-size:18pt}
  #printRoot .sp{width:100%;border-collapse:separate;border-spacing:2.5mm;table-layout:fixed;margin:2mm 0 0;break-inside:avoid}
  #printRoot .sp td{border:1.2px solid #000;border-radius:2mm;height:23mm;padding:1mm;text-align:center;vertical-align:middle;line-height:1.25}
  #printRoot .sp td.e{border:1px dashed #bbb}
  #printRoot .sp td.off{color:#666;border-style:dotted}
  #printRoot .sp td.pmk{border-width:2.6px;background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printRoot .sp .nm{font-size:13pt;font-weight:700}
  #printRoot .sp .sm{font-size:8.5pt}
  #printRoot .sp .dp{font-size:8.5pt;font-weight:700}
  #printRoot .sp .tg{font-size:7.5pt;color:#333}
  #printRoot .sp.plain td{height:24mm}
  #printRoot .splay{display:flex;gap:4mm;align-items:flex-start}
  #printRoot .splay .rl{flex:0 0 20%;width:20%}
  #printRoot .splay .sr{flex:1 1 80%;min-width:0}
  #printRoot .splay .sp{margin-top:0;border-spacing:2mm}
  #printRoot .srl{width:100%;border-collapse:collapse;font-size:8.5pt;table-layout:fixed}
  #printRoot .srl th,#printRoot .srl td{border:.8px solid #000;padding:.6mm 1mm;line-height:1.2;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #printRoot .srl th{background:#eee;-webkit-print-color-adjust:exact;print-color-adjust:exact;text-align:center}
  #printRoot .srl .n{width:9mm;text-align:center}
  #printRoot .srl .x{width:15mm;font-size:7.5pt}
  #printRoot .srl tr.off td{color:#666}
  #printRoot .srl.tight{font-size:7.5pt}
  #printRoot .srl.tight td{padding:.3mm 1mm}
  #printRoot .sp .nm.big{font-size:18pt}
  #printRoot .pfprint{margin-top:5mm;break-inside:avoid;color:#000}
  #printRoot .pfprint h2{font-size:11pt;margin:0 0 2px}
  #printRoot .sp td.spdesk{border:0;height:auto;padding:0;background:none}
  #printRoot .sp td.spdesk span{display:inline-block;border:1.5px solid #000;border-radius:2mm;padding:1mm 16mm;font-weight:700}
}
.rhead h2{margin:0;font-size:1.25rem;line-height:1.35}
.rhead h2 small{display:block;font-size:.95rem;font-weight:400;color:var(--muted)}
.back{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:1.4rem}
.summary{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px;font-size:1.02rem}
.summary b{font-variant-numeric:tabular-nums}
.roster{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.srow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;min-height:64px}
.srow:last-child{border-bottom:0}
.srow .nm{font-size:1.15rem;font-weight:700;line-height:1.35}
.srow .nm .no{font-size:.9rem;font-weight:400;color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
.srow .nm small{display:block;font-weight:400;font-size:.9rem;color:var(--muted)}
.srow .nm small.hint{color:var(--blue)}
.srow.marked{background:var(--paper)}
.srow.inactive{background:var(--paper);cursor:default}
.srow.inactive .nm{color:var(--muted);font-weight:400}
.srow.hasfail{border-bottom:0}
.failbox{display:flex;flex-direction:column;gap:6px;padding:0 16px 12px;border-bottom:1px solid var(--line)}
.failbox:last-child{border-bottom:0}
.fline{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px}
.fsub{font-size:.95rem;font-weight:700}
.fchk{display:inline-flex;align-items:center;gap:6px;font-size:.95rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.fchk.on{color:var(--green,#1a7f37);font-weight:700}
.fchk input{width:20px;height:20px;margin:0;cursor:pointer}
.failitem{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.failadd{display:grid;grid-template-columns:1fr 110px auto;gap:8px;margin-top:10px}
.pill.p-위탁{background:var(--amber-bg);color:var(--amber)}
.pill.p-결번{background:var(--gray-bg);color:var(--gray)}
.pill.p-자퇴,.pill.p-유예{background:var(--red-bg);color:var(--red)}
.pill.p-전출{background:var(--gray-bg);color:var(--gray)}
.stag{display:inline-block;margin-left:5px;vertical-align:2px;font-size:.72rem;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--green-bg);color:var(--green);white-space:nowrap}
.stlist .srow{cursor:default}
.stlist .srow.strow{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.stlist .strow .chip{padding:5px 10px;font-size:.88rem}
.seg.k3{grid-template-columns:repeat(3,1fr);margin:0;gap:6px}
.seg.k3 button{min-height:44px;font-size:.95rem;padding:0 6px}
.stlist .srow{grid-template-columns:1fr 210px}
@media (max-width:420px){.stlist .srow{grid-template-columns:1fr}}
.pill{font-size:.95rem;font-weight:700;border-radius:8px;padding:6px 10px;white-space:nowrap}
.pill.present{color:var(--muted);font-weight:400}
.r-미인정{background:var(--red-bg);color:var(--red)}
.r-질병{background:var(--blue-bg);color:var(--blue)}
.r-인정{background:var(--green-bg);color:var(--green)}
.r-기타{background:var(--gray-bg);color:var(--gray)}
.donebar{position:sticky;bottom:calc(80px + env(safe-area-inset-bottom,0px));margin-top:14px}
.donebar .btn{min-height:56px;font-size:1.05rem;box-shadow:0 0 0 6px var(--paper)}

.rline{display:grid;grid-template-columns:1fr auto;align-items:stretch;border-bottom:1px solid var(--line)}
.rline:last-child{border-bottom:0}
.rline .srow{border-bottom:0}
.obtn{border:0;border-left:1px solid var(--line);background:var(--card);color:var(--blue);font-weight:700;font-size:.95rem;min-width:64px;padding:0 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.obtn small{font-size:.75rem;font-weight:400;color:var(--muted)}
.fmt{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}
.fmt span{background:var(--sel);border-radius:8px;text-align:center;font-size:.85rem;font-weight:700;padding:6px 2px}
/* 4-column roster */
.rt4 .srow{grid-template-columns:46px 38px 40px 1fr 62px;gap:5px;padding:10px 8px 10px 12px}
.rt4 .c{text-align:center;font-variant-numeric:tabular-nums;font-size:.95rem;color:var(--muted)}
.rt4 .c.cn{color:var(--ink);font-weight:700;font-size:1.05rem}
.rt4 .nm{font-size:1.1rem;min-width:0}
.rt4 .nm small{max-width:none;white-space:normal}
.rt4 .pill{text-align:center;padding:5px 4px;font-size:.88rem}
.rt4 .pill.two{font-size:.8rem;line-height:1.25}
.rt4 .obtn{min-width:52px;padding:0 6px}
/* 이름 옆에서 바로 누르는 출결 단추 */
.rt4 .srow.qrow{cursor:default;row-gap:8px;grid-template-columns:46px 38px 40px 1fr}
.mbtn{grid-column:1 / -1;border:1.5px solid var(--line);background:var(--card);border-radius:10px;color:var(--blue);font-size:.88rem;font-weight:700;min-height:36px;padding:0 12px;white-space:nowrap}
.qk{grid-column:1 / -1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.qk button{min-height:42px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;font-size:.92rem;font-weight:600;padding:0}
.qk:not(.qr) button[aria-pressed="true"]{background:var(--cover);border-color:var(--cover);color:var(--cover-ink)}
.qk:not(.qr) button[data-k="출석"][aria-pressed="true"]{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.qk.qr{grid-template-columns:repeat(4,1fr)}
.qk.qr.qd{grid-template-columns:1fr 1fr}
.qk.qr.qd.one{grid-template-columns:1fr}
.qk.qr button.r-미인정{background:var(--red-bg);color:var(--red);border-color:var(--red)}
.qk.qr button.r-질병{background:var(--blue-bg);color:var(--blue);border-color:var(--blue)}
.qk.qr button.r-인정{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.qk.qr button.r-기타{background:var(--gray-bg);color:var(--gray);border-color:var(--gray)}
.qk.qr.qd button{font-weight:700}
.qk.qr button{min-height:38px;font-size:.86rem;color:var(--muted)}
.qk.qr button[aria-pressed="true"]{border-color:currentColor;font-weight:700}
.rhd{background:var(--paper)}
.rhd .srow{min-height:0;padding-top:8px;padding-bottom:8px;cursor:default}
.rhd .srow span{font-size:.76rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
.rhd .srow .nmh{text-align:left}
.obh{font-size:.76rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.2;display:flex;align-items:center;justify-content:center;min-width:52px;border-left:1px solid var(--line)}
/* seating chart */
.seatbar{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.seatbar.edit{border-color:var(--amber);background:var(--amber-bg)}
.seatbar.edit b{display:block;margin-bottom:2px}
.seatwrap{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:10px}
.seats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.desk{margin:10px auto;width:40%;text-align:center;background:var(--cover);color:var(--cover-ink);border-radius:8px;padding:6px 0;font-weight:700;font-size:.9rem}
.seat{position:relative;min-height:66px;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;text-align:center;min-width:0}
.seat b{font-size:1rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat small{font-size:.74rem;color:var(--muted)}
button.seat{cursor:pointer;background:var(--card)}
.seat.empty{border-style:dashed;background:transparent}
.seat.off{opacity:.55}
.seat.mk{border-width:2px}
.seat.mk.r-미인정{border-color:var(--red)} .seat.mk.r-질병{border-color:var(--blue)} .seat.mk.r-인정{border-color:var(--green)} .seat.mk.r-기타{border-color:var(--gray)}
.seat.mk small{color:inherit;font-weight:700}
.seat .snote{font-size:.66rem;font-weight:600;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .sdocs{font-size:.6rem;font-weight:700;color:var(--red);line-height:1.2;margin-top:1px}
.hrdot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.srow[aria-current="true"]{background:var(--sel)}
/* 자리 배치 편집: 왼쪽 자리표 + 오른쪽 명단 2단 */
.seat2{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px;align-items:start}
.seatedit{padding:6px}
.seatedit .seats{gap:4px}
.seatedit .seat{min-height:54px}
.seatedit .seat b{font-size:.8rem}
.seatedit .seat small{font-size:.66rem}
.seat.sel{outline:3px solid var(--blue);outline-offset:1px;background:var(--blue-bg);border-style:solid}
.seatlist{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:6px;max-height:72vh;overflow:auto;position:sticky;top:104px}
.seatlist .slhead{font-size:.76rem;font-weight:700;color:var(--blue);padding:2px 2px 6px;line-height:1.35}
.slbtn{display:flex;align-items:center;gap:4px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 2px;font-size:.86rem;line-height:1.2;font-weight:700;color:var(--ink)}
.slbtn em{font-style:normal;color:var(--muted);font-size:.74rem;min-width:16px;font-weight:400}
.slbtn.seated{color:var(--muted);font-weight:400}
.slbtn.seated::after{content:"✓";margin-left:auto;color:var(--green);font-weight:700}
.slbtn.here{background:var(--blue-bg)}
.pool{background:var(--card);border:1.5px dashed var(--amber);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.dragchip{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;font-weight:600;background:var(--paper)}
.dragchip em{font-style:normal;color:var(--muted);font-weight:400;margin-right:4px;font-size:.85rem}
.seatedit .seat[data-drag-no]{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.dragging{opacity:.35}
.dropover{outline:3px solid var(--blue);outline-offset:1px;background:var(--blue-bg)!important}
.ghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;margin:-54px 0 0 -40px;min-width:80px;text-align:center;background:var(--cover);color:var(--cover-ink);font-weight:700;padding:8px 12px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.flags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.flag{font-size:.72rem;font-weight:700;border-radius:5px;padding:1px 6px;white-space:nowrap}
.sflags{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:2px}
.sflags .flag{font-size:.62rem;padding:0 3px}
.fl0{background:#E8E1F7;color:#5B3FA6} .fl1{background:#FBE3EF;color:#A3245E} .fl2{background:var(--orange-bg);color:var(--orange)} .fl3{background:var(--blue-bg);color:var(--blue)} .fl4{background:var(--amber-bg);color:var(--amber)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fl0{background:#2E2546;color:#C3B1F0} :root:not([data-theme="light"]) .fl1{background:#46202F;color:#F2A3C6}}
.chip.flagchip{border-color:transparent}
.chip.flagchip[aria-pressed="false"]{background:var(--card);color:var(--muted);border-color:var(--line)}
.chip.flagchip[aria-pressed="true"]{font-weight:700;border-color:currentColor}
/* 제출물(유인물·서류) */
.sub-b{display:inline-block;max-width:100%;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:2px;margin-left:6px;font-size:.74rem;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--red-bg);color:var(--red)}
.sub-b.more{background:var(--gray-bg);color:var(--gray)}
.subbar{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.chip.subchip{border-color:var(--red);color:var(--red);background:var(--red-bg);font-weight:700}
.chip.subchip.ok{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.subdot{position:absolute;top:3px;left:3px;font-style:normal;font-size:.62rem;font-weight:700;line-height:1.35;border-radius:4px;padding:0 4px;background:var(--red);color:#fff}
.prog{background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--cover);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.prog-row{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:baseline;margin-bottom:4px}
.prog .pl{font-size:.85rem;font-weight:700;color:var(--muted)}
.prog .pv{font-weight:700;font-size:1.02rem}
.prog .pv small{display:block;font-weight:400;font-size:.82rem;color:var(--muted)}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,16,24,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;padding:20px 16px calc(72px + env(safe-area-inset-bottom,0px))}
.sheet .inner{max-width:560px;margin:0 auto}
.sheet .actbar{position:sticky;bottom:0;z-index:1;background:var(--card);border-top:1px solid var(--line);padding:10px 0;box-shadow:0 80px 0 var(--card)}
.sheet h3{margin:0 0 14px;font-size:1.25rem}
.sheet h3 small{font-size:.95rem;font-weight:400;color:var(--muted);margin-left:6px}
.seg-label{font-weight:700;margin:4px 0 8px}
.seg{display:grid;gap:8px;margin-bottom:16px}
.seg.k5{grid-template-columns:repeat(5,1fr)}
.seg.k4{grid-template-columns:repeat(4,1fr)}
.seg button{min-height:54px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-size:1.02rem;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--cover);border-color:var(--cover);color:var(--cover-ink)}
.seg button[data-k="출석"][aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.seg[aria-disabled="true"]{opacity:.35;pointer-events:none}
.hrbox{background:var(--blue-bg);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ovrow{display:grid;grid-template-columns:60px 1fr;gap:10px;align-items:center;margin-bottom:10px}
.ovrow b{font-size:1.05rem}
.ovrow select.changed{border-color:var(--amber);background:var(--amber-bg)}

/* risk */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.92rem;color:var(--muted);margin:2px 0 12px}
.risk{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;background:var(--card);border:1.5px solid var(--line);border-left:8px solid var(--c);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.risk .nm{font-size:1.12rem;font-weight:700}
.risk .nm small{font-weight:400;color:var(--muted);margin-left:6px;font-size:.9rem}
.risk .det{font-size:.9rem;color:var(--muted)}
.risk .remain{grid-row:1 / span 2;grid-column:2;text-align:right;font-size:.9rem;line-height:1.3}
.risk .remain b{display:block;font-size:1.5rem;color:var(--c);font-variant-numeric:tabular-nums}

.minus{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:56px;text-align:center;border-radius:10px;padding:4px 10px}
.m-zero .minus{color:var(--muted);font-weight:400;font-size:1.1rem}
.m-some .minus{color:var(--ink)}
.m-warn{background:var(--orange-bg)} .m-warn .minus{background:var(--orange);color:#fff}
.m-danger{background:var(--red-bg)} .m-danger .minus{background:var(--red);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .m-warn .minus,:root:not([data-theme="light"]) .m-danger .minus{color:#111}}
.lg::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.lg.warn::before{background:var(--orange)} .lg.danger::before{background:var(--red)}
/* observation */
.stu-li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:8px;font-size:1.08rem;min-height:56px}
.stu-li .no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;width:56px}
.stu-li .cnt{margin-left:auto;font-size:.9rem;color:var(--muted)}
.entry{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.entry .when{font-weight:700;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:.85rem;color:var(--blue);background:var(--blue-bg);border-radius:6px;padding:1px 8px;margin:0 4px 0 0}
.entry p{margin:6px 0 0;white-space:pre-wrap}

.seg.k2{grid-template-columns:1fr 1fr}
.kind{font-size:.8rem;font-weight:700;border-radius:6px;padding:1px 8px}
.k-수업{background:var(--sel);color:var(--cover)} .k-학급{background:var(--green-bg);color:var(--green)}
/* 화면 단추로 어둡게를 고른 경우(위 자동 어둡게 규칙과 같은 내용) */
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{border-bottom-color:var(--cover-soft)}
:root[data-theme="dark"] .fl0{background:#2E2546;color:#C3B1F0} :root[data-theme="dark"] .fl1{background:#46202F;color:#F2A3C6}
:root[data-theme="dark"] .m-warn .minus,:root[data-theme="dark"] .m-danger .minus{color:#111}
:root[data-theme="dark"] .k-수업{color:var(--cover-ink)}
.themebtn{background:none;border:1.5px solid var(--cover-soft);color:var(--cover-ink);border-radius:10px;padding:2px 10px;font-size:.85rem;font-weight:600;align-self:center;white-space:nowrap}
header.top .hright{display:flex;align-items:center;gap:8px}
@media (max-width:480px){.today{font-size:.88rem}.clock{font-size:1.25rem}.themebtn{padding:2px 7px;font-size:.8rem}.tlab,.yr{display:none}}

/* ===== 추가 디자인: 손그림 일러스트풍 (크림색 종이 벽, 남색 교복, 금색 명찰, 굵은 먹선) ===== */
:root[data-design="illust"]{
  --paper:#F4ECDD; --card:#FFFDF6; --ink:#25262B; --muted:#6E604F; --line:#4A3D31;
  --cover:#26355E; --cover-ink:#FFF8EA; --cover-soft:#E9C46A;
  --red:#C2412D; --blue:#2E6DA4; --green:#2F7D5B; --amber:#A86A12; --gray:#5E5A55;
  --orange:#D9822B; --orange-bg:#FBE3C8; --red-bg:#F9DCD3; --blue-bg:#DCEBF5; --green-bg:#DCEFE2; --amber-bg:#FBEBC5; --gray-bg:#ECE5D9; --sel:#F8E7C2;
  --sans:"Gowun Dodum","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --round:"Jua","Gowun Dodum","IBM Plex Sans KR",sans-serif;
  --shadow:#25262B; --rule:rgba(120,90,60,.07);
}
/* 어둡게 + 추가 디자인 = 초록 칠판 */
@media (prefers-color-scheme:dark){
  :root[data-design="illust"]:not([data-theme="light"]){
    --paper:#22332B; --card:#2C4136; --ink:#F5F0E2; --muted:#CBC4B0; --line:#A9BBA9;
    --cover:#182520; --cover-ink:#F7F1DE; --cover-soft:#E9C46A;
    --red:#FF9B85; --blue:#9CC9F0; --green:#8FE0B0; --amber:#F2CC6B; --gray:#CFC8BB;
    --orange:#F5A65B; --orange-bg:#4A3420; --red-bg:#4A2A24; --blue-bg:#22384A; --green-bg:#24412F; --amber-bg:#4A4020; --gray-bg:#34433A; --sel:#3A4D40;
    --shadow:rgba(0,0,0,.45); --rule:rgba(255,255,255,.035);
  }
}
:root[data-design="illust"][data-theme="dark"]{
  --paper:#22332B; --card:#2C4136; --ink:#F5F0E2; --muted:#CBC4B0; --line:#A9BBA9;
  --cover:#182520; --cover-ink:#F7F1DE; --cover-soft:#E9C46A;
  --red:#FF9B85; --blue:#9CC9F0; --green:#8FE0B0; --amber:#F2CC6B; --gray:#CFC8BB;
  --orange:#F5A65B; --orange-bg:#4A3420; --red-bg:#4A2A24; --blue-bg:#22384A; --green-bg:#24412F; --amber-bg:#4A4020; --gray-bg:#34433A; --sel:#3A4D40;
  --shadow:rgba(0,0,0,.45); --rule:rgba(255,255,255,.035);
}
[data-design="illust"] body{background-image:linear-gradient(var(--rule) 1px,transparent 1px);background-size:100% 30px}
[data-design="illust"] h2,[data-design="illust"] h3,[data-design="illust"] .btn,[data-design="illust"] .chip,[data-design="illust"] nav.tabs button,
[data-design="illust"] .today,[data-design="illust"] .clock,[data-design="illust"] .seg button,[data-design="illust"] .qk button,[data-design="illust"] .mbtn,
[data-design="illust"] .wc b,[data-design="illust"] .alert,[data-design="illust"] .per .s,[data-design="illust"] .dpick,[data-design="illust"] .themebtn{font-family:var(--round);font-weight:400;letter-spacing:.01em}
[data-design="illust"] header.top{border-bottom:4px solid var(--cover-soft)}
[data-design="illust"] .themebtn{border-color:var(--cover-soft);border-radius:999px}
[data-design="illust"] nav.tabs{border-bottom:2px solid var(--ink)}
[data-design="illust"] nav.tabs button[aria-current="page"]{border-bottom-color:var(--orange)}
/* 굵은 먹선 + 살짝 어긋난 그림자: 손그림 카드 느낌 */
[data-design="illust"] .btn,[data-design="illust"] .chip,[data-design="illust"] .seg button,[data-design="illust"] .qk button,[data-design="illust"] .mbtn,
[data-design="illust"] .back,[data-design="illust"] .datebar > button,[data-design="illust"] .dpick,[data-design="illust"] .obtn{border-width:2px;box-shadow:2px 2px 0 var(--shadow)}
[data-design="illust"] .btn:active,[data-design="illust"] .chip:active,[data-design="illust"] .seg button:active,[data-design="illust"] .qk button:active{transform:translate(2px,2px);box-shadow:none}
[data-design="illust"] .roster,[data-design="illust"] .summary,[data-design="illust"] .sec,[data-design="illust"] .intro,[data-design="illust"] .seatwrap,
[data-design="illust"] .prog,[data-design="illust"] .subbar,[data-design="illust"] .entry,[data-design="illust"] .stu-li,[data-design="illust"] .tt-list,
[data-design="illust"] .seatbar,[data-design="illust"] .seatlist,[data-design="illust"] .nrow,[data-design="illust"] .risk{border-width:2px;border-color:var(--ink);box-shadow:3px 3px 0 var(--shadow)}
[data-design="illust"] .alert{border-width:2px;box-shadow:3px 3px 0 var(--shadow);border-radius:16px}
[data-design="illust"] .wc{border-width:2px;box-shadow:2px 2px 0 var(--shadow)}
[data-design="illust"] .wc.empty{box-shadow:none}
[data-design="illust"] table.week th.tcol{border-radius:12px;box-shadow:2px 2px 0 var(--shadow)}
[data-design="illust"] .sheet{border-top:3px solid var(--ink);border-radius:24px 24px 0 0}

<script>
'use strict';
/* ---------- helpers ---------- */
const LS = 'educheck:';
const MAX_P = 8;
const AM_ALERT = '08:20', PM_ALERT = '16:00';
/* 교시별 시작 시각과 한 교시 길이(분). 학교 일과가 바뀌면 이 두 줄만 고치면 됩니다. */
const PERIOD_START = ['08:40','09:40','10:40','11:40','13:30','14:30','15:30','16:30'];
/* 요일별 종례 자리(그 앞 교시가 마지막 교시). 기본: 월·수·목 7교시, 화 5교시, 금 6교시까지.
   설정 → 주간 시간표에서 칸을 ‘종례’로 바꾸면 그 값을 씁니다. */
const JONGRYE_DEFAULT = { 1:8, 2:6, 3:8, 4:8, 5:7 };
/* 과목 이름을 '종례'로 만들어 시간표에 넣은 칸도 종례로 봅니다(가장 먼저 따름) */
const isJrCourse = c => !!(c && String(c.subject || '').replace(/\s/g, '') === '종례');
function jongryeP(dow){
  const cfg = C(); if (!cfg) return JONGRYE_DEFAULT[dow] || 8;
  const s = cfg.slots.find(x => x.day === dow && isJrCourse(course(x.courseId)));
  return (s && s.period) || (cfg.settings.jongrye || {})[dow] || JONGRYE_DEFAULT[dow] || 8;
}
const lastP = d => d ? jongryeP(dowOf(d)) - 1 : 7;
const PERIOD_MIN = 50;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayKey = () => keyOf(new Date());
const parseKey = k => { const [a,b,c] = k.split('-').map(Number); return new Date(a, b-1, c); };
const dowOf = k => parseKey(k).getDay();
const toMin = t => { const [h,m] = String(t).split(':').map(Number); return h*60 + (m||0); };
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const rid = () => Math.random().toString(36).slice(2, 9);
const safeId = s => String(s).replace(/[^A-Za-z0-9_-]/g, '_');
const DAYS = ['일','월','화','수','목','금','토'];
const KINDS = ['결석','지각','조퇴','결과'];
const REASONS = ['미인정','질병','인정','기타'];
const fmtDate = k => { const d = parseKey(k); return `${d.getMonth()+1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일`; };
const parseFrac = s => { s = String(s).trim(); if (s.includes('/')) { const [a,b] = s.split('/').map(Number); return b ? a/b : 1/3; } const v = Number(s); return v > 0 && v < 1 ? v : 1/3; };
const label = r => r.k === '출석' ? '출석' : `${r.r === '인정' && r.sub ? '인정(' + r.sub + ')' : r.r} ${r.k}`;

function defaultConfig(){
  return { v:2, groups:[], homeroomId:null, courses:[], slots:[], subs:[],
    settings:{ approvedAsPresent:true, tags:[] } };
}
const OBS_TAGS = {
  수업: ['1인 1역할','수업 태도','과목 역량','모둠활동 역할','발표 역량','학습에 대한 성실도'],
  학급: ['1인 1역할','협업 역량','의사소통 역량','자기주도학습 역량','주도적 활동 참여 역량','청소 봉사정신','솔선수범 태도','교칙 준수 태도','깊이 있는 내적 성숙도','인품']
};

/* ---------- state ---------- */
const S = { config:null, att:{}, obs:{} };
let ui = { tab:'home', date:todayKey(), session:null, riskCourse:null, obsNo:null, obsGroup:null, obsKind:null, pick:null, obsTags:[], openSec:null };

function docData(id){
  if (id === 'config') return S.config;
  if (id.startsWith('att-')) return S.att[id.slice(4)];
  if (id.startsWith('obs-')) { const no = Object.keys(S.obs).find(n => 'obs-'+safeId(n) === id); return no ? S.obs[no] : null; }
  return null;
}

/* ---------- Firebase 설정 ---------- */
/* 앱 주인 계정. 주인만 바로 들어오고, 다른 계정은 주인이 설정 → ‘계정 공유’에 등록한 것만 들어옵니다.
   (Firestore 보안 규칙에도 같은 주소가 적혀 있어야 합니다) */
const OWNER_EMAIL = 'pol0827@goedu.kr';
const emailOf = u => String((u && u.email) || '').toLowerCase();
const isOwnerUser = u => !!(u && u.emailVerified && emailOf(u) === OWNER_EMAIL);
const accessCol = () => Store.fs.collection('access');
const ROLE_TEXT = { view:'보기만', edit:'입력도' };
const viewOnly = () => ui.role === 'view';
function denyView(){ toast('보기 전용 계정이라 저장되지 않습니다.'); }
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDKzN4BdLShKjs_gexQ-wna3yqr7YTvPmg",
  authDomain: "poem-8cade.firebaseapp.com",
  projectId: "poem-8cade",
  storageBucket: "poem-8cade.firebasestorage.app",
  messagingSenderId: "563750721541",
  appId: "1:563750721541:web:186822db5555cc0f36e46c"
};

/* ---------- (예전) 접속 코드: 이제는 기존 기록을 Google 계정으로 옮길 때만 씁니다 ---------- */
const CODE_KEY = 'educheck:code';
const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const normCode = t => String(t || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const fmtCode = c => c.match(/.{1,4}/g).join('-');
const validCode = c => c.length === 24 && [...c].every(ch => CODE_ABC.includes(ch));
const getCode = () => { try { return localStorage.getItem(CODE_KEY) || ''; } catch (e) { return ''; } };

/* ---------- storage: Firestore  spaces/{Google 계정 uid}/docs/{docId} ---------- */
const stable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map(kk => [kk, x[kk]])) : x);
const Store = {
  fs:null, code:'', timers:{}, chains:{}, dirty:{}, held:{}, unsub:null,
  colOf(space){ return this.fs.collection('spaces').doc(space).collection('docs'); },
  col(){ return this.colOf(this.code); },
  async loadAll(){
    /* 이 기기에 남아 있는 기록(캐시)으로 먼저 바로 열고, 서버의 바뀐 내용은 실시간 연결(listen)이 곧 채웁니다.
       캐시에 설정이 없으면(처음 쓰는 기기) 서버에서 받습니다. */
    const toObj = snap => { const out = {}; snap.forEach(d => { out[d.id] = d.data(); }); return out; };
    try {
      const c = await Promise.race([this.col().get({ source: 'cache' }), new Promise((_, no) => setTimeout(() => no(new Error('slow')), 2500))]);
      const o = toObj(c); if (o.config) return o;
    } catch (e) {}
    return toObj(await this.col().get());
  },
  save(id){
    /* 보기 전용 계정: 저장하지 않고, 잠시 뒤 서버 기록으로 화면을 되돌립니다 */
    if (viewOnly()) { denyView(); clearTimeout(this.revertT); this.revertT = setTimeout(() => connect(this.code), 1200); return; }
    this.dirty[id] = true; clearTimeout(this.timers[id]); this.timers[id] = setTimeout(() => { this.timers[id] = 0; this.flush(id); }, 450); },
  flush(id){
    const d = docData(id); if (!d || !this.code) { delete this.dirty[id]; return; }
    const data = JSON.parse(JSON.stringify(d));
    this.chains[id] = (this.chains[id] || Promise.resolve())
      .then(() => this.col().doc(id).set(data))
      .then(() => { if (!this.timers[id]) delete this.dirty[id]; })
      .catch(e => {
        console.error(e);
        if (e && e.code === 'permission-denied') toast('저장 권한이 없습니다. Firestore 보안 규칙을 확인하세요.');
        else toast('저장하지 못했습니다. 인터넷 연결을 확인하세요.');
      });
  },
  flushAll(){ Object.keys(this.timers).forEach(id => { if (this.timers[id]) { clearTimeout(this.timers[id]); this.timers[id] = 0; this.flush(id); } }); },
  async remove(id){ if (viewOnly()) return denyView(); try { await this.col().doc(id).delete(); } catch (e) {} },
  /* 다른 기기에서 바뀐 내용을 실시간으로 받아 옵니다 */
  listen(){
    this.stop();
    this.unsub = this.col().onSnapshot(snap => {
      snap.docChanges().forEach(ch => {
        if (ch.doc.metadata.hasPendingWrites) return;
        this.held[ch.doc.id] = { data: ch.type === 'removed' ? null : ch.doc.data() };
      });
      this.applyHeld();
    }, e => console.error(e));
  },
  stop(){ if (this.unsub) { this.unsub(); this.unsub = null; } this.held = {}; },
  applyHeld(){
    const ids = Object.keys(this.held); if (!ids.length || !S.config || busy()) return;
    let changed = false;
    ids.forEach(id => { const h = this.held[id]; delete this.held[id]; if (this.dirty[id]) return; if (applyRemote(id, h.data)) changed = true; });
    if (changed) render();
  }
};
/* 시트를 열어 둔 채·입력 중에는 받아 둔 변경을 잠시 보류했다가, 닫으면 반영합니다 */
function busy(){
  if (sheetOpen() || ui.seatEdit || drag) return true;
  const a = document.activeElement;
  return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#view'));
}
function applyRemote(id, data){
  if (id === 'config') {
    if (!data) return false;
    const n = normalizeConfig(data); if (stable(n) === stable(S.config)) return false;
    S.config = n; return true;
  }
  if (id.startsWith('att-')) {
    const d = id.slice(4);
    if (!data) { if (!(d in S.att)) return false; delete S.att[d]; return true; }
    data.rec ||= {}; data.done ||= {}; data.neis ||= {};
    if (stable(data) === stable(S.att[d])) return false;
    S.att[d] = data; return true;
  }
  if (id.startsWith('obs-')) {
    if (!data || !data.no) { const no = Object.keys(S.obs).find(n => 'obs-' + safeId(n) === id); if (!no) return false; delete S.obs[no]; return true; }
    const n = { ...data, entries: data.entries || [] };
    if (stable(n) === stable(S.obs[data.no])) return false;
    S.obs[data.no] = n; return true;
  }
  return false;
}
const saveDoc = id => Store.save(id);
const saveConfig = () => saveDoc('config');
const attOf = (date, create) => { if (!S.att[date] && create) S.att[date] = { rec:{}, done:{}, neis:{} }; const a = S.att[date]; if (a) { a.rec ||= {}; a.done ||= {}; a.neis ||= {}; } return a; };
const saveAtt = date => saveDoc('att-' + date);

/* ---------- model ---------- */
const C = () => S.config;
const group = id => C().groups.find(g => g.id === id);
const course = id => C().courses.find(c => c.id === id);
const groupName = id => (group(id) || {}).name || '';
const realNo = no => /^\d{3,6}$/.test(String(no));
const cmpStu = (a, b) => (a.num && b.num && a.num !== b.num) ? a.num - b.num : String(a.no).localeCompare(String(b.no), 'ko', {numeric:true});
const studentsOf = g => (g ? [...g.students] : []).sort(cmpStu);
function studentObj(no, gid){ const g0 = gid && group(gid); const hit = g0 && g0.students.find(x => x.no === no); if (hit) return hit; for (const g of C().groups) { const s = g.students.find(x => x.no === no); if (s) return s; } return null; }
const numOf = (no, gid) => { const s = studentObj(no, gid); return s && s.num ? s.num : ''; };
const dispNo = (no, gid) => numOf(no, gid) ? `${numOf(no, gid)}번` : realNo(no) ? String(no) : '';
const dispNoS = st => st.num ? `${st.num}번` : realNo(st.no) ? String(st.no) : '';
/* 원반 (original homeroom) for a student entry */
function homeOf(st){
  if (st.home) return { home: st.home, homeNum: st.homeNum || '' };
  if (realNo(st.no) && String(st.no).length === 5) { const n = String(st.no); return { home: `${n[0]}-${Number(n.slice(1, 3))}`, homeNum: Number(n.slice(3)) }; }
  return { home:'', homeNum:'' };
}
const homeText = st => { const h = homeOf(st); return h.home ? `${h.home}반 ${h.homeNum ? h.homeNum + '번' : ''}`.trim() : ''; };
const stOf = no => (C().status && C().status[no]) || '';
const isActive = no => !stOf(no);
/* 학적 상태: ST_OFF는 하나만 고르며 출결 체크에서 빠짐, ST_TAGS는 재학생에게 덧붙이는 표시(출결 체크함) */
const ST_OFF = ['위탁','자퇴','유예','전출','결번'];
const ST_TAGS = ['전입','학생선수'];
const NOT_ENROLLED = ['결번','자퇴','유예','전출'];
const stuTagsOf = no => (C().stuTags && C().stuTags[no]) || [];
const stuTagBadges = no => stuTagsOf(no).map(t => `<span class="stag">${esc(t)}</span>`).join('');
const offCounts = list => ST_OFF.filter(s => s !== '결번').map(s => [s, list.filter(st => stOf(st.no) === s).length]).filter(x => x[1]);
const dispName = st => st.name || '(결번)';
const splitKey = k => { const i = k.indexOf(':'); return [Number(k.slice(0, i)), k.slice(i+1)]; };

/* weekly timetable + today-only changes (stored on that date's record as `ov`) */
function baseSlot(date, p){ const s = C().slots.find(x => x.day === dowOf(date) && x.period === p); return s && course(s.courseId) ? s.courseId : ''; }
function slotFor(date, p){
  const ov = S.att[date] && S.att[date].ov;
  if (ov && Object.prototype.hasOwnProperty.call(ov, p)) { const id = ov[p]; return { courseId: id && course(id) ? id : '', changed:true }; }
  return { courseId: baseSlot(date, p), changed:false };
}
const hasOverride = date => !!(S.att[date] && S.att[date].ov && Object.keys(S.att[date].ov).length);

function sessionInfo(key){
  if (key === 'hr') return { key, title:'아침 조회', sub: groupName(C().homeroomId), groupId: C().homeroomId, period:0 };
  const [p, cid] = splitKey(key); const c = course(cid);
  return { key, period:p, courseId:cid, groupId: c && c.groupId, title: `${p}교시 ${c ? c.subject : '삭제된 과목'}`, sub: c ? groupName(c.groupId) : '' };
}
function allStudents(){
  const m = new Map();
  C().groups.forEach(g => g.students.forEach(s => {
    if (!m.has(s.no)) m.set(s.no, { no:s.no, name:s.name, num:s.num, groups:[] });
    m.get(s.no).groups.push(g.id);
  }));
  return [...m.values()].sort(cmpStu);
}
const studentName = no => { for (const g of C().groups) { const s = g.students.find(x => x.no === no); if (s) return s.name; } return (S.obs[no] && S.obs[no].name) || no; };
function sessionsOn(date){
  const a = S.att[date]; if (!a) return [];
  const keys = new Set(Object.keys(a.done || {}).filter(k => a.done[k]));
  Object.entries(a.rec || {}).forEach(([k, r]) => { if (Object.values(r).some(x => x.k !== '출석' || x.n)) keys.add(k); });
  return [...keys].sort((x, y) => (x === 'hr' ? -1 : y === 'hr' ? 1 : splitKey(x)[0] - splitKey(y)[0]));
}
const marksIn = (date, key) => { const r = (S.att[date] && S.att[date].rec[key]) || {}; return Object.values(r).filter(x => x.k !== '출석'); };
function tallyText(list){
  const t = {}; list.forEach(x => t[x.k] = (t[x.k] || 0) + 1);
  return KINDS.filter(k => t[k]).map(k => `${k} ${t[k]}`).join(', ') || '전원 출석';
}
const clsSess = d => sessionsOn(d).filter(k => k !== 'hr');
const hasHr = d => sessionsOn(d).includes('hr');
const neisCls = d => { const a = S.att[d]; if (!a) return false; if (typeof a.neis.cls === 'boolean') return a.neis.cls; const cs = clsSess(d); return cs.length > 0 && cs.every(k => a.neis[k]); };
const neisPend = d => { const a = S.att[d]; if (!a || a.neisHide) return []; const p = []; if (hasHr(d) && !a.neis.hr) p.push('학급'); if (clsSess(d).length && !neisCls(d)) p.push('수업반'); return p; };
function unsyncedCount(){ return Object.keys(S.att).reduce((n, d) => n + neisPend(d).length, 0); }

/* ---------- shell ---------- */
const TABS = [['home','출결'],['risk','미이수'],['obs','누가기록'],['neis','나이스'],['stat','통계'],['sg','생교위'],['tt','시간표'],['settings','설정']];

}

  $('#view').innerHTML = ({home:renderHome, roster:renderRoster, risk:renderRisk, obs:renderObs, neis:renderNeis, stat:renderStat, sg:renderSg, tt:renderTT, settings:renderSettings, seats:renderSeatEditor}[ui.tab] || renderHome)();
  if (ui.tab === 'tt') ttMount();
  if (ui.tab === 'settings' && ui.role === 'owner' && ui.accList === undefined) loadAccess();

function go(tab){ ui.seatEdit = false; ui.seatSel = null; ui.undoMode = false; ui.tab = tab; closeSheet(); render(); window.scrollTo(0, 0); }
let toastT;
function toast(msg){
  let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400);
}
function openSheet(html){ $('#sheetRoot').innerHTML = `<div class="backdrop" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="inner">${html}</div></div>`; }
function closeSheet(){ $('#sheetRoot').innerHTML = ''; }
const sheetOpen = () => !!$('#sheetRoot .sheet');
function askConfirm(msg, yesLabel, onYes){
  openSheet(`<h3>${esc(msg)}</h3><div class="row" style="margin-top:16px"><button class="btn" data-act="closeSheet">취소</button><span class="spacer"></span><button class="btn danger" id="cfYes">${esc(yesLabel)}</button></div>`);

/* ---------- 화면 밝기 (이 기기에만 기억) ---------- */
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
/* 디자인: 기본 ↔ 추가(손그림 일러스트풍). 이 기기에만 기억 */
function paintDesignBtn(){ const b = $('#designBtn'); if (!b) return; const on = document.documentElement.dataset.design === 'illust'; b.innerHTML = `🎨<span class="tlab"> ${on ? '기본' : '추가'} 디자인</span>`; b.setAttribute('aria-pressed', on); }

function toggleTheme(){

/* ---------- clock ---------- */
let lastMinute = -1, lastDay = todayKey();
function tick(){
  const d = new Date();
  $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  const tt = `<span class="yr">${d.getFullYear()}. </span>${d.getMonth()+1}. ${d.getDate()}. (${DAYS[d.getDay()]})`;
  if ($('#today').innerHTML !== tt) $('#today').innerHTML = tt;
  const m = d.getHours()*60 + d.getMinutes();
  if (m !== lastMinute) {
    lastMinute = m;
    const k = keyOf(d);
    if (k !== lastDay) { if (ui.date === lastDay) ui.date = k; lastDay = k; }
    if (S.config && ui.tab === 'home' && !sheetOpen()) render();
  }
  if (S.config) Store.applyHeld();
}

/* ---------- HOME: date + timetable ---------- */
const abbrSubj = c => { if (!c) return ''; if (c.short) return c.short; const w = c.subject.trim().split(/\s+/); return w.length > 1 ? w.map(x => x[0]).join('').slice(0, 4) : w[0].slice(0, 3); };
const abbrGroup = id => { const g = group(id); if (!g) return ''; if (g.short) return g.short; const m = g.name.match(/(\d)\s*학년\s*(\d+)\s*반/); if (m) return `${m[1]}-${m[2]}`; const t = g.name.trim().split(/\s+/); return t[t.length - 1].slice(0, 4); };
const mondayOf = k => { const d = parseKey(k); const w = d.getDay(); d.setDate(d.getDate() - (w === 0 ? 6 : w - 1)); return d; };
const weekDates = k => { const m = mondayOf(k); return [0,1,2,3,4].map(i => { const d = new Date(m); d.setDate(m.getDate() + i); return keyOf(d); }); };
function renderHome(){
  if (!C().groups.length) return renderIntro();
  const today = todayKey(); const days = weekDates(ui.date); const thisWeek = days.includes(today);
  const md = k => { const d = parseKey(k); return `${d.getMonth()+1}/${d.getDate()}`; };
  let h = `<div class="datebar"><button data-act="wshift" data-n="-7" aria-label="지난주">‹</button>
    <label class="dpick"><span>${md(days[0])} ~ ${md(days[4])}${thisWeek ? ' 이번 주' : ''}</span><input type="date" value="${ui.date}" data-change="setdate" aria-label="날짜로 이동"></label>
    <button data-act="wshift" data-n="7" aria-label="다음 주">›</button></div>
    <div class="datenote">${thisWeek ? '<span class="muted small">칸을 누르면 출결 체크로 들어갑니다.</span>' : '<button class="link" data-act="dtoday">이번 주로</button>'}<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm ${ui.undoMode ? 'primary' : ''}" data-act="undoMode">${ui.undoMode ? '해제 끝내기' : '✓ 체크 해제'}</button><button class="btn sm" data-act="ovEdit">하루만 변경</button></span></div>
    ${ui.undoMode ? '<p class="small" style="color:var(--amber);font-weight:700;margin:0 0 8px">✓ 표시된 칸을 누르면 체크 완료가 해제됩니다. 다 했으면 ‘해제 끝내기’를 누르세요.</p>' : ''}`;

  const wd = new Date().getDay();
  if (thisWeek && wd > 0 && wd < 6 && isHoliday(today)) h += `<div class="alert lunch">오늘은 ${esc(holidaysOf()[today] || '휴업일')}입니다.<span>설정 → 휴업일에 등록된 날</span></div>`;
  if (thisWeek && wd > 0 && wd < 6 && !isHoliday(today)) {
    const a = S.att[today] || { done:{}, neis:{} }; const n = nowMin();
    /* 지금 시각과 오늘 시간표를 맞춰 보고 안내합니다 */
    const fmtT = m => `${Math.floor(m / 60)}:${pad(m % 60)}`;
    const todayCls = [];
    for (let p = 1; p <= MAX_P; p++) {
      const c = course(slotFor(today, p).courseId); if (!c || isJrCourse(c)) continue;
      const s = toMin(PERIOD_START[p - 1]);
      todayCls.push({ key: `${p}:${c.id}`, name: `${p}교시 ${c.subject}(${groupName(c.groupId)})`, s, e: s + PERIOD_MIN });
    }
    const note = (cls, key, title, sub, prog) => { const role = roleLine(key, today); return `<button class="alert ${cls}" data-act="openAt" data-d="${today}" data-key="${esc(key)}">${esc(title)}${prog ? `<span class="pl">📘 ${esc(prog)}</span>` : ''}${role && cls !== 'warn' ? `<span class="pl rl">🙋 ${esc(role)}</span>` : ''}<span>${esc(sub)}</span></button>`; };
    /* 그 반 지난 시간에 적어 둔 ‘다음 시간 시작할 곳’ */
    const progLine = key => {
      const [p, cid] = splitKey(key); const today0 = progOf(today, key);
      if (today0 && today0.done) return `오늘 진도: ${today0.done}`;
      const t = ((progHistory(cid, today, p)[0]) || {}).next || '';
      if (!t.trim()) return '';
      return /(다|요|\.|부터|까지|차례)$/.test(t.trim()) ? `이번 진도: ${t.trim()}` : `${t.trim()} 할 차례입니다.`;
    };
    const first = toMin(PERIOD_START[0]);
    const hrOpen = C().homeroomId && !a.done.hr;
    const cur = todayCls.find(x => n >= x.s && n < x.e);
    const next = todayCls.find(x => x.s > n);
    if (hrOpen && n >= toMin(AM_ALERT) && n < first)
      h += note('', 'hr', '아침 조회 시간입니다. 우리반 출결을 입력하세요.', `1교시는 ${fmtT(first)}에 시작합니다 · 눌러서 담임 학급 출결 체크`);
    /* 지금 수업: 체크 전이면 빨간 안내, 체크했으면 파란 안내로 계속 보여 줌(진도·역할 포함) */
    if (cur) {
      h += a.done[cur.key]
        ? note('info', cur.key, `지금은 ${cur.name} 수업 시간입니다.`, `${fmtT(cur.s)}~${fmtT(cur.e)} · ✓ 출결 체크 완료`, progLine(cur.key))
        : note('', cur.key, `지금은 ${cur.name} 수업 시간입니다.`, `${fmtT(cur.s)}~${fmtT(cur.e)} · 눌러서 출결 체크`, progLine(cur.key));
      if (next) h += note('info', next.key, `다음 수업은 ${next.name}입니다.`, `${fmtT(next.s)} 시작 · ${next.s - n}분 뒤`, progLine(next.key));
    } else {
      /* 지금이 어느 교시 시간인데 내 수업이 없으면 '공강' */
      const pNow = PERIOD_START.findIndex(t => n >= toMin(t) && n < toMin(t) + PERIOD_MIN) + 1;
      /* 연달아 공강이면 다음 내 수업 시작(없으면 마지막 교시 끝)까지 모두 합쳐 남은 시간을 셉니다 */
      const lastEnd = toMin(PERIOD_START[lastP(today) - 1]) + PERIOD_MIN;
      const pEnd = next ? Number(next.key.split(':')[0]) - 1 : lastP(today);
      const left = next ? next.s - n : lastEnd - n;
      /* 쉬는 시간도 다음 내 수업 전까지는 공강으로 봅니다(1교시 시작 뒤부터) */
      const pFrom = pNow > 0 ? pNow : PERIOD_START.findIndex(t => toMin(t) > n) + 1;
      const range = pFrom < 1 || pFrom > pEnd ? '쉬는 시간' : pEnd > pFrom ? `${pFrom}~${pEnd}교시 공강` : `${pFrom}교시 공강`;
      const free = !cur && n >= first && n < lastEnd ? `지금은 공강(${left}분 남음), ` : '';
      if (next) h += note('info', next.key, `${free}다음 수업은 ${next.name}입니다.`, free ? `${range} · ${fmtT(next.s)} 시작` : `${fmtT(next.s)} 시작 · ${next.s - n}분 뒤`, progLine(next.key));
      else if (free) h += `<div class="alert info" style="cursor:default">${free}오늘 남은 수업은 없습니다.<span>${range}</span></div>`;
      else if (todayCls.length && n >= lastEnd) h += `<div class="alert info" style="cursor:default">오늘 수업은 모두 끝났습니다. 수고 많으셨어요!<span>오늘 수업 ${todayCls.length}시간 · 체크 완료 ${todayCls.filter(x => a.done[x.key]).length}시간</span></div>`;
    }
    /* 점심 안내: 4교시가 비면 4교시 시간부터, 4교시 수업이 있으면 점심시간(12:30~13:30)에 */
    const p4 = toMin(PERIOD_START[3]), lunchS = p4 + PERIOD_MIN, lunchE = toMin(PERIOD_START[4]);
    const has4 = todayCls.some(x => x.key.startsWith('4:'));
    if (!has4 && n >= p4 && n < lunchE) h += `<div class="alert lunch">4교시 수업이 없어요. 점심 먹으러 일찍 가세요!<span>점심시간 ${fmtT(lunchS)}~${fmtT(lunchE)}</span></div>`;
    else if (has4 && n >= lunchS && n < lunchE) h += `<div class="alert lunch">${fmtT(lunchS)}~${fmtT(lunchE)} 점심 맛있게 먹자!<span>4교시 수고 많으셨어요</span></div>`;
    const missed = todayCls.filter(x => x.e <= n && !a.done[x.key]).map(x => ({ key: x.key, name: x.name }));
    if (hrOpen && n >= first) missed.unshift({ key: 'hr', name: '아침 조회' });
    if (missed.length)
      h += note('warn', missed[0].key, `아직 출결을 체크하지 않은 시간이 ${missed.length}개 있습니다.`, `${missed.map(x => x.name).join(', ')} · 누르면 ${missed[0].name}부터 엽니다`);
    const pend = neisPend(today);
    if (pend.length && n >= toMin(PM_ALERT))
      h += `<button class="alert" data-act="tab" data-id="neis">오늘 작성한 출결 내역을 나이스(NEIS)에 반영하세요.<span>미반영: ${pend.join(', ')}</span></button>`;
  }

  const cell = (d, key, top, bottom, changed) => {
    const a = S.att[d] || { done:{} }; const done = a.done[key]; const mk = marksIn(d, key).length;
    const pend = docPendCount(d, key);
    /* 그 반 학생에게 붙여 둔 특이사항(교시 및 특이사항 창) — ✓ 아래, 결석 인원 위에 짧게 */
    const gid = key === 'hr' ? C().homeroomId : ((course(splitKey(key)[1]) || {}).groupId);
    const gg = gid && group(gid);
    const fl = gg ? noticeFlags().map(f => [f, gg.students.filter(st => isActive(st.no) && flagsOf(gid, st.no).includes(f)).length]).filter(x => x[1]) : [];
    const flTxt = fl.map(([f, n]) => `${flagShort(f)}${n}`).join('·');
    return `<td class="${d === today ? 'tcol' : ''}"><div class="wcw"><button class="wc ${done ? 'ok' : ''} ${changed ? 'chgd' : ''}" data-act="${ui.undoMode ? 'undoneAt' : 'openAt'}" data-d="${d}" data-key="${esc(key)}" aria-label="${fmtDate(d)} ${esc(top)} ${esc(bottom)}${done ? ' 완료' : ''}">
      <b>${esc(top)}</b><span>${esc(bottom)}</span>${flTxt ? `<em class="wfl" title="${esc(fl.map(([f, n]) => `${f} ${n}명`).join(', '))}">${esc(flTxt)}</em>` : ''}${done ? '<i class="ck">✓</i>' : ''}${mk ? `<i class="mk">${mk}명</i>` : ''}</button>${pend ? `<button class="dmk" data-act="docList" data-d="${d}" data-key="${esc(key)}" aria-label="미제출 서류 ${pend}개 보기">미제출<br>서류 ${pend}개</button>` : ''}</div></td>`;
  };
  h += `<div class="scroll-x"><table class="week"><thead><tr><th></th>${days.map((d, i) => `<th class="${d === today ? 'tcol' : ''}">${DAYS[i+1]}<small>${md(d)}${isHoliday(d) ? ' 휴업' : ''}</small></th>`).join('')}</tr></thead><tbody>`;
  const holCell = d => `<td class="${d === today ? 'tcol' : ''}"><span class="wc empty">휴업</span></td>`;
  if (C().homeroomId) h += `<tr class="hrrow"><th>조회</th>${days.map(d => isHoliday(d) && !(S.att[d] && S.att[d].rec && S.att[d].rec.hr) ? holCell(d) : cell(d, 'hr', '담임', abbrGroup(C().homeroomId), false)).join('')}</tr>`;
  for (let p = 1; p <= MAX_P; p++) {
    h += `<tr><th>${p}</th>`;
    days.forEach(d => {
      const { courseId, changed } = slotFor(d, p); const c = courseId && course(courseId);
      if ((!c || isJrCourse(c)) && p === jongryeP(dowOf(d))) { h += `<td class="${d === today ? 'tcol' : ''}"><span class="wc empty jr">종례</span></td>`; return; }
      if (c && isHoliday(d) && !marksIn(d, `${p}:${c.id}`).length && !((S.att[d] || {}).done || {})[`${p}:${c.id}`]) { h += holCell(d); return; }
      h += c ? cell(d, `${p}:${c.id}`, abbrSubj(c), abbrGroup(c.groupId), changed)
             : `<td class="${d === today ? 'tcol' : ''}"><span class="wc empty ${changed ? 'chgd' : ''}">${changed ? '휴강' : ''}</span></td>`;
    });
    h += `</tr>`;
  }
  h += `</tbody></table></div>

/* ---------- 개근 학생 ----------
   settings.perfect = { since:'YYYY-MM-DD', nos:[학번…] }: 기준일까지 개근임을 선생님이 확인한 학생.
   기준일 다음 날부터 담임 조회 기록에 미인정·질병·기타 결석·지각·조퇴·결과가 하나라도 있으면 개근이 끊깁니다(인정은 출석으로 셈). */
const pfOf = () => { const p = C().settings.perfect || {}; return { since: p.since || todayKey(), nos: Array.isArray(p.nos) ? p.nos : [] }; };
const isAbsMark = r => r && KINDS.includes(r.k) && r.r !== '인정';
function firstBreak(no, after){
  const ds = Object.keys(S.att).filter(d => !after || d > after).sort();
  for (const d of ds) { const r = (((S.att[d].rec || {}).hr) || {})[no]; if (isAbsMark(r)) return { d, r }; }
  return null;
}
function perfectState(){
  const g = group(C().homeroomId); const pf = pfOf(); if (!g || !pf.nos.length) return null;
  const list = studentsOf(g).filter(st => pf.nos.includes(st.no) && isActive(st.no));
  const keep = [], lost = [];
  list.forEach(st => { const b = firstBreak(st.no, pf.since); if (b) lost.push([st, b]); else keep.push(st); });
  return { pf, keep, lost };
}
/* 인쇄물 맨 아래에 붙일 개근 학생: 학급(담임 학급) 출결 인쇄물에만. 수업반 인쇄에는 넣지 않음 */

  <p>${keep.length ? keep.map(nm).join(', ') : '개근을 이어 가는 학생이 없습니다.'}</p>${lost.length ? `<p>개근이 끊긴 학생: ${lost.map(([st, b]) => `${nm(st)}(${mdOf(b.d)} ${esc(b.r.r)} ${esc(b.r.k)})`).join(', ')}</p>` : ''}</div>`;

/* ---------- 개인 시간표 (PDF) ----------
   PDF는 spaces/{uid}/files 에 저장합니다. m-{id}: 파일 정보, c-{id}-{i}: 내용 조각(한 문서 1MB 한도 때문에 나눔).
   화면에는 PDF.js로 쪽마다 그림으로 그려 휴대폰에서도 그대로 보이게 합니다. */
/* 학생 개인 시간표 두 가지: 수업(kind 'stu'), 시험 기간(kind 'stux'). 둘 다 우리반 명렬표대로 학생마다 파일 하나.
   예전 한 장짜리 칸에 올린 파일(수업 'class', 시험 'exam')은 각 화면 위 상자에서 학생에게 옮기거나 지웁니다. */
const TT_KINDS = [['stu','수업 시간표'],['stux','시험 기간 시간표']];
const TT_OLD = { stu:['class','수업 시간표'], stux:['exam','시험 기간 시간표'] };
const TT_MAX = 8 * 1024 * 1024, TT_CHUNK = 700000;
const TT = { metas:null, loading:false, bytes:{}, el:null, shownId:null };
const filesCol = () => Store.fs.collection('spaces').doc(Store.code).collection('files');
const toB64 = buf => { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = s => { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB';
let pdfjsP = null;
function loadPdfJs(){
  return pdfjsP ||= new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; ok(window.pdfjsLib); };
    sc.onerror = () => { pdfjsP = null; no(new Error('pdfjs')); };
    document.head.appendChild(sc);
  });
}
function ttResetCache(){ TT.metas = null; TT.loading = false; TT.bytes = {}; TT.shownId = null; if (TT.el) TT.el.innerHTML = ''; TT.allKey = null; if (TT.allEl) TT.allEl.innerHTML = ''; }
const ttKind = () => ui.ttKind === 'stux' ? 'stux' : 'stu';
const ttList = kind => (TT.metas || []).filter(m => m.kind === kind).sort((a, b) => a.ts - b.ts);
function renderTT(){
  const kind = ttKind();
  let h = `<h2>학생 개인 시간표</h2><div class="seg k2" style="margin-bottom:16px">${TT_KINDS.map(([k, lab]) => `<button data-act="ttKind" data-k="${k}" aria-pressed="${kind === k}">${lab}</button>`).join('')}</div>`;
  if (TT.metas === null) return h + `<div class="loading">불러오는 중…</div>`;

}
async function ttLoadMetas(){
  if (TT.loading) return; TT.loading = true;
  try { const snap = await filesCol().where('t', '==', 'm').get(); TT.metas = snap.docs.map(d => d.data()); }
  catch (e) { console.error(e); TT.metas = []; toast(e && e.code === 'permission-denied' ? '시간표 파일 권한이 없습니다. Firestore 보안 규칙을 확인하세요.' : '시간표 목록을 불러오지 못했습니다.'); }
  TT.loading = false; if (ui.tab === 'tt') render();
}
function ttMount(){

  const all = $('#ttAllSlot');
  if (all) {
    if (!TT.allEl) { TT.allEl = document.createElement('div'); TT.allEl.className = 'ttview'; }
    all.appendChild(TT.allEl);

    if (TT.allKey !== key) stuAllShow(list, key);

async function ttBytes(id){
  if (TT.bytes[id]) return TT.bytes[id];
  const m = (TT.metas || []).find(x => x.id === id); if (!m) throw new Error('nofile');
  const parts = await Promise.all([...Array(m.n)].map((_, i) => filesCol().doc(`c-${id}-${i}`).get()));
  return (TT.bytes[id] = fromB64(parts.map(p => (p.data() || {}).d || '').join('')));
}
/* 파일 하나를 el 안에 그림(사진은 그대로, PDF는 쪽마다 그림). alive()가 거짓이 되면 그리기를 멈춤 */
async function ttDraw(el, id, alive){
  const bytes = await ttBytes(id);
  const meta = (TT.metas || []).find(x => x.id === id) || {};
  if (!alive()) return;
  if (isXlMime(meta.mime) || isXlName(meta.name)) {
    const X = await loadXlsx(); if (!alive()) return;
    const wb = X.read(bytes, { type:'array' });
    el.innerHTML = wb.SheetNames.map(n => `<div class="ttxl">${wb.SheetNames.length > 1 ? `<div class="xlname">${esc(n)}</div>` : ''}${X.utils.sheet_to_html(wb.Sheets[n], { header:'', footer:'' })}</div>`).join('');
    return;
  }
  if (/^image\//.test(meta.mime || '')) { el.innerHTML = `<img alt="${esc(meta.name || '')}" src="${URL.createObjectURL(new Blob([bytes], { type: meta.mime }))}">`; return; }
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: bytes.slice() }).promise;
  if (!alive()) return;
  el.innerHTML = '';
  const w = el.clientWidth || 560; const dpr = Math.min(2, window.devicePixelRatio || 1);
  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p); if (!alive()) return;
    const vp = page.getViewport({ scale: (w / page.getViewport({ scale: 1 }).width) * dpr });
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    el.appendChild(cv);
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
  }
}
async function ttShow(id){
  TT.shownId = id; const el = TT.el;
  el.innerHTML = '<div class="loading" style="min-height:30vh">파일을 여는 중…</div>';
  try { await ttDraw(el, id, () => TT.shownId === id); }
  catch (e) { console.error(e); if (TT.shownId === id) el.innerHTML = `<div class="empty">파일을 화면에 그리지 못했습니다.<br>‘새 창으로 열기’를 눌러 보세요.</div>`; }
}
/* 한꺼번에 보기: 올린 학생 모두를 번호 차례로 위에서 아래로 (하나씩 차례로 불러 그림) */

/* 파일 이름으로 학생 찾기: 이름(가장 긴 이름 하나) → 학번 → 번호(이름 속 1~2자리 숫자 중 마지막) */
const nfc = s => String(s || '').normalize('NFC');
function stuMatch(fname, studs){
  const base = nfc(fname).replace(/\.[^.]+$/, '');
  const byName = studs.filter(st => base.includes(nfc(st.name)));
  if (byName.length) { const L = Math.max(...byName.map(st => nfc(st.name).length)); const top = byName.filter(st => nfc(st.name).length === L); if (top.length === 1) return top[0].no; }
  const nums = base.match(/\d+/g) || [];
  const byNo = studs.find(st => realNo(st.no) && nums.includes(String(st.no))); if (byNo) return byNo.no;
  const small = nums.filter(x => x.length <= 2).map(Number);
  if (small.length) { const s = studs.find(st => Number(st.num) === small[small.length - 1]); if (s) return s.no; }
  return '';
}
const stuFileOk = f => /\.(pdf|png|jpe?g|xlsx|xls)$/i.test(f.name) || f.type === 'application/pdf' || /^image\//.test(f.type) || isXlMime(f.type);
/* 한 파일에 여러 학생 시간표가 들어 있으면(PDF 여러 쪽, 엑셀 여러 시트·여러 덩어리) 안의 글자(학번·이름)로 학생을 찾아 학생마다 나눔 */
let pdflibP = null;
function loadPdfLib(){
  return pdflibP ||= new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
    sc.onload = () => ok(window.PDFLib); sc.onerror = () => { pdflibP = null; no(new Error('pdflib')); };
    document.head.appendChild(sc);
  });
}
/* 글자 속에서 학생 찾기: 학번 → 이름(가장 긴 이름이 하나뿐일 때) */
function stuMatchText(text, studs){
  const s = nfc(text); const nums = s.match(/\d+/g) || [];
  const byNo = studs.find(st => realNo(st.no) && nums.includes(String(st.no))); if (byNo) return byNo.no;
  const flat = s.replace(/\s+/g, '');
  const byName = studs.filter(st => st.name && flat.includes(nfc(st.name)));
  if (byName.length) { const L = Math.max(...byName.map(st => nfc(st.name).length)); const top = byName.filter(st => nfc(st.name).length === L); if (top.length === 1) return top[0].no; }
  return '';
}
/* 쪽(시트·줄)마다 찾은 학생 → 학생별 묶음. 학생을 못 찾은 쪽은 바로 앞 학생(맨 앞이면 첫 학생)에게 붙임 */
function stuGroups(owner){
  let last = owner.find(x => x) || ''; const g = new Map();
  owner.forEach((no, i) => { if (no) last = no; if (!last) return; if (!g.has(last)) g.set(last, []); g.get(last).push(i); });

const baseName = n => nfc(n).replace(/\.[^.]+$/, '');
const XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
/* PDF 나누기: 쪽마다 학번(없으면 이름)이 적힌 자리를 찾아, 그 위치에서 가로로 잘라 학생마다 모읍니다.

    const pg = await pdf.getPage(i); const tc = await pg.getTextContent();
    const items = tc.items.filter(x => x.str && x.str.trim()).map(x => ({ s: nfc(x.str), y: x.transform[5] }));
    const find = map => { const hit = new Map(); for (const it of items) for (const tok of it.s.split(/\s+/)) { const no = map.get(tok); if (no && (!hit.has(no) || hit.get(no) < it.y)) hit.set(no, it.y); } return hit; };

  const useNo = new Set(pages.flatMap(pp => [...pp.hitNo.keys()])).size >= 2;
  /* 자르는 높이: 학번 줄 바로 위 머리 줄(40pt 안)까지 넣고, 그 위 줄과의 사이에서 자름 */

  }

  if (g.size < 2) return [{ file: f, no: stuMatch(f.name, studs) || [...g.keys()][0] || '' }];

  const out = [];
  for (const [no, list] of g) {
    const d = await PL.PDFDocument.create();
    const copied = await d.copyPages(src, list.map(s => s.i));
    copied.forEach((pg, k) => { const s = list[k]; const x0 = s.view[0], w = s.view[2] - s.view[0]; pg.setMediaBox(x0, s.lo, w, s.hi - s.lo); pg.setCropBox(x0, s.lo, w, s.hi - s.lo); d.addPage(pg); });
    out.push({ file: new File([await d.save()], `${baseName(f.name)}_${studentName(no)}.pdf`, { type:'application/pdf' }), no, part: list.length > 1 ? list.length + '조각' : '' });
  }
  return out;
}
async function splitXl(f, studs){
  const X = await loadXlsx(); const wb = X.read(new Uint8Array(await f.arrayBuffer()), { type:'array' });
  const mk = (no, sheets, part) => { const nb = X.utils.book_new(); sheets.forEach(([n, ws]) => X.utils.book_append_sheet(nb, ws, n.slice(0, 31))); return { file: new File([X.write(nb, { type:'array', bookType:'xlsx' })], `${baseName(f.name)}_${studentName(no)}.xlsx`, { type: XLSX_MIME }), no, part }; };
  const names = wb.SheetNames;
  if (names.length > 1) {
    const g = stuGroups(names.map(n => stuMatchText(n, studs) || stuMatchText(X.utils.sheet_to_csv(wb.Sheets[n]), studs)));
    if (g.size >= 2) return [...g].map(([no, idx]) => mk(no, idx.map(i => [names[i], wb.Sheets[names[i]]]), idx.length + '시트'));
    return [{ file: f, no: stuMatch(f.name, studs) || [...g.keys()][0] || '' }];
  }
  /* 시트 하나에 학생들이 위아래로 이어져 있으면 학번·이름이 나오는 줄마다 끊어 나눔 */
  const ws = wb.Sheets[names[0]];
  const aoa = X.utils.sheet_to_json(ws, { header:1, defval:'', raw:false, blankrows:true });
  const g = stuGroups(aoa.map(r => stuMatchText(r.join(' '), studs)));
  if (g.size < 2) return [{ file: f, no: stuMatch(f.name, studs) || [...g.keys()][0] || '' }];
  const r0 = X.utils.decode_range(ws['!ref'] || 'A1').s.r;
  return [...g].map(([no, idx]) => {
    const nws = X.utils.aoa_to_sheet(idx.map(i => aoa[i]));
    const lo = idx[0], hi = idx[idx.length - 1];
    if (hi - lo + 1 === idx.length) nws['!merges'] = (ws['!merges'] || []).filter(m => m.s.r - r0 >= lo && m.e.r - r0 <= hi).map(m => ({ s:{ r: m.s.r - r0 - lo, c: m.s.c }, e:{ r: m.e.r - r0 - lo, c: m.e.c } }));

    return mk(no, [[names[0], nws]], idx.length + '줄');

}
async function stuPick(files){

/* 큰 사진은 긴 변 2000px JPEG로 줄임. 브라우저가 못 여는 사진(아이폰 HEIC 등)은 'noimg' */
async function shrinkImg(f){
  const url = URL.createObjectURL(f);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('noimg')); i.src = url; });
    const k = Math.min(1, TT_IMG_MAX / Math.max(img.naturalWidth, img.naturalHeight));
    if (k === 1 && f.size < 1500000) return null;
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.88));
  } finally { URL.revokeObjectURL(url); }
}
async function ttRemove(m){

  for (let i = 0; i < m.n; i++) await filesCol().doc(`c-${m.id}-${i}`).delete();
  TT.metas = TT.metas.filter(x => x.id !== m.id); delete TT.bytes[m.id]; if (TT.shownId === m.id) TT.shownId = null;

async function stuPut(f, no, kind = ttKind()){

    const buf = await blob.arrayBuffer(); const b64 = toB64(buf); const cnt = Math.max(1, Math.ceil(b64.length / TT_CHUNK));

/* ---------- 월간 통계 (나이스 '월별 출결 현황'·'학급별출결현황'과 같은 형식) ----------
   담임 학급의 아침 조회(담임) 출결 기록으로 만듭니다. 인정은 학급별 표에 세지 않습니다(나이스와 같음). */
const STAT_R = ['질병','미인정','기타'];
const curYM = () => todayKey().slice(0, 7);
function ymShift(ym, n){ const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
const ymText = ym => { const [y, m] = ym.split('-'); return `${y}년 ${Number(m)}월`; };
const dotDate = d => { const x = parseKey(d); return `${x.getFullYear()}.${pad(x.getMonth() + 1)}.${pad(x.getDate())}(${DAYS[x.getDay()]})`; };
const gubunOf = r => `${r.r}${r.k}`;
function weekdaysIn(ym){ const [y, m] = ym.split('-').map(Number); let n = 0; for (const d = new Date(y, m - 1, 1); d.getMonth() === m - 1; d.setDate(d.getDate() + 1)) { const w = d.getDay(); if (w > 0 && w < 6) n++; } return n; }
/* 휴업일: 설정에 등록한 날(settings.holidays = { 'YYYY-MM-DD': 이름 }) 중 평일만 수업일수에서 뺍니다 */
const holidaysOf = () => (C().settings.holidays || {});

function monthRows(ym){

    Object.entries(((S.att[d].rec || {}).hr) || {}).forEach(([no, r]) => {

      const st = g.students.find(x => x.no === no);
      out.push({ d, no, num: (st && st.num) || Number(numOf(no)) || 0, name: st ? st.name : studentName(no), gubun: gubunOf(r), periods: r.n || '', reason: r.sub || '', r });
    });
